<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 550">
  <defs>
    <linearGradient id="cdmGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="decoderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="displayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="protectedGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.05" />
    </linearGradient>
    <symbol id="lock3" viewBox="0 0 20 20">
      <rect x="3" y="8" width="14" height="10" rx="2" fill="currentColor"/>
      <path d="M6 8V6a4 4 0 1 1 8 0v2" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="shield3" viewBox="0 0 24 24">
      <path d="M12 2L4 6v6c0 5.5 3.5 10 8 11 4.5-1 8-5.5 8-11V6l-8-4z" fill="currentColor"/>
    </symbol>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="550" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CDM / Protected Process Flow</text>
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Vulkan Video Protected Content Architecture</text>
  
  <!-- Protected memory boundary -->
  <rect x="40" y="65" width="720" height="420" rx="12" fill="url(#protectedGrad3)" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">PROTECTED MEMORY BOUNDARY</text>
  <use xlink:href="#shield3" x="250" y="72" width="18" height="18" fill="#22c55e"/>
  
  <!-- CDM / Protected Process Box -->
  <rect x="80" y="110" width="640" height="100" rx="8" fill="url(#cdmGrad3)"/>
  <use xlink:href="#lock3" x="640" y="120" width="20" height="20" fill="#fff"/>
  <text x="400" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">CDM / Protected Process</text>
  <text x="120" y="170" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7">1. Receive encrypted stream (CENC/CBCS)</text>
  <text x="120" y="190" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7">2. Decrypt slices using content keys</text>
  <text x="450" y="170" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7">3. Write decrypted NAL units to:</text>
  <text x="470" y="190" font-family="monospace" font-size="11" fill="#fff">Protected VkBuffer</text>
  
  <!-- Arrow from CDM to Decoder -->
  <line x1="400" y1="210" x2="400" y2="270" stroke="#22c55e" stroke-width="3"/>
  <polygon points="400,275 393,260 407,260" fill="#22c55e"/>
  <rect x="280" y="225" width="240" height="25" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="400" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#16a34a">Protected VkBuffer (clear bitstream)</text>
  
  <!-- Vulkan Video Decoder Box -->
  <rect x="80" y="280" width="640" height="100" rx="8" fill="url(#decoderGrad)"/>
  <use xlink:href="#shield3" x="640" y="290" width="20" height="20" fill="#fff"/>
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Vulkan Video Decoder (Protected Queue)</text>
  <text x="120" y="340" font-family="monospace" font-size="11" fill="#ede9fe">srcBuffer = protected VkBuffer (decrypted slices)</text>
  <text x="120" y="360" font-family="monospace" font-size="11" fill="#ede9fe">dstPictureResource = protected VkImage</text>
  
  <!-- Key insight badge -->
  <rect x="480" y="335" width="220" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="590" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a34a">DECODER IS</text>
  <text x="590" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a34a">CRYPTO-AGNOSTIC!</text>
  
  <!-- Arrow from Decoder to Display -->
  <line x1="400" y1="380" x2="400" y2="435" stroke="#22c55e" stroke-width="3"/>
  <polygon points="400,440 393,425 407,425" fill="#22c55e"/>
  <rect x="280" y="395" width="240" height="25" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="400" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#16a34a">Protected VkImage (decoded frame)</text>
  
  <!-- Display Box -->
  <rect x="80" y="445" width="640" height="50" rx="8" fill="url(#displayGrad)"/>
  <use xlink:href="#lock3" x="640" y="455" width="20" height="20" fill="#fff"/>
  <text x="400" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Compositor / Display - HDCP Output</text>
  
  <!-- Legend -->
  <rect x="40" y="500" width="720" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Security:</text>
  <text x="130" y="525" font-family="Arial, sans-serif" font-size="10" fill="#475569">Decrypted content only exists in protected memory</text>
  <text x="420" y="525" font-family="Arial, sans-serif" font-size="10" fill="#475569">|</text>
  <text x="440" y="525" font-family="Arial, sans-serif" font-size="10" fill="#475569">Unprivileged code cannot read protected memory</text>
</svg>
