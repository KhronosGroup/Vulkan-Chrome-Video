<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbdefb"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>
    <linearGradient id="newG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="reuseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <marker id="inh" viewBox="0 0 14 14" refX="13" refY="7"
            markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="none" stroke="#37474f" stroke-width="1.5"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>

  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">
    Vulkan Video Encode — Proposed Class Hierarchy (mirrors VA-API)
  </text>

  <!-- Top-level interface -->
  <rect x="450" y="60" width="300" height="60" rx="6" fill="url(#topG)" stroke="#0d47a1" stroke-width="2"/>
  <text x="600" y="85" text-anchor="middle" font-size="14" font-weight="bold">VideoEncodeAccelerator</text>
  <text x="600" y="103" text-anchor="middle" font-size="11" fill="#0d47a1">media/video/video_encode_accelerator.h</text>
  <text x="600" y="115" text-anchor="middle" font-size="10" fill="#37474f">(abstract — stable Mojo-facing API)</text>

  <!-- inheritance line -->
  <line x1="600" y1="120" x2="600" y2="155" stroke="#37474f" stroke-width="1.5" marker-end="url(#inh)"/>

  <!-- VulkanVideoEncodeAccelerator -->
  <rect x="380" y="155" width="440" height="100" rx="6" fill="url(#newG)" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">VulkanVideoEncodeAccelerator</text>
  <text x="600" y="198" text-anchor="middle" font-size="11" fill="#1b5e20">media/gpu/vulkan/vulkan_video_encode_accelerator.{h,cc} (NEW)</text>
  <text x="600" y="216" text-anchor="middle" font-size="10" fill="#37474f">• Owns wrapper, image pools, bitstream pool, cmd buffer pool</text>
  <text x="600" y="230" text-anchor="middle" font-size="10" fill="#37474f">• Drives encoder_task_runner_</text>
  <text x="600" y="244" text-anchor="middle" font-size="10" fill="#37474f">• Implements Encode / UseOutputBitstreamBuffer / RequestEncodingParametersChange / Flush</text>

  <!-- Composition: owns delegate, owns wrapper -->
  <line x1="600" y1="255" x2="600" y2="290" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="278" font-size="10" fill="#546e7a">owns</text>

  <!-- VulkanVideoEncoderDelegate (base) -->
  <rect x="350" y="290" width="500" height="90" rx="6" fill="url(#newG)" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">VulkanVideoEncoderDelegate</text>
  <text x="600" y="330" text-anchor="middle" font-size="11" fill="#1b5e20">media/gpu/vulkan/vulkan_video_encoder_delegate.{h,cc} (NEW)</text>
  <text x="600" y="347" text-anchor="middle" font-size="10" fill="#37474f">Encode(EncodeJob&amp;) • PrepareEncodeJob() • UpdateRates() • GetMetadata()</text>
  <text x="600" y="361" text-anchor="middle" font-size="10" fill="#37474f">(peer of VaapiVideoEncoderDelegate)</text>

  <!-- inheritance to per-codec -->
  <line x1="600" y1="380" x2="600" y2="410" stroke="#37474f" stroke-width="1.5"/>
  <line x1="200" y1="410" x2="1000" y2="410" stroke="#37474f" stroke-width="1.5"/>

  <line x1="200" y1="410" x2="200" y2="440" stroke="#37474f" stroke-width="1.5" marker-end="url(#inh)"/>
  <line x1="600" y1="410" x2="600" y2="440" stroke="#37474f" stroke-width="1.5" marker-end="url(#inh)"/>
  <line x1="1000" y1="410" x2="1000" y2="440" stroke="#37474f" stroke-width="1.5" marker-end="url(#inh)"/>

  <!-- H264 delegate -->
  <rect x="40" y="440" width="320" height="155" rx="6" fill="url(#newG)" stroke="#2e7d32" stroke-width="2"/>
  <text x="200" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">H264VulkanVideoEncoderDelegate</text>
  <text x="200" y="479" text-anchor="middle" font-size="10" fill="#1b5e20">media/gpu/vulkan/h264_vulkan_&#8230;  (NEW)</text>
  <text x="60" y="498" font-size="10" fill="#37474f">• Owns H264SPS / H264PPS (Chromium)</text>
  <text x="60" y="513" font-size="10" fill="#37474f">• Owns StdVideoH264SPS / PPS (Vulkan)</text>
  <text x="60" y="527" font-size="10" fill="#37474f">• Converts SPS/PPS/Slice + RefPicList</text>
  <text x="60" y="541" font-size="10" fill="#37474f">• Owns H264DPB (reuse from media/gpu/)</text>
  <text x="60" y="555" font-size="10" fill="#37474f">• Uses H264RateCtrlRTC (reused)</text>
  <text x="60" y="569" font-size="10" fill="#37474f">• Uses h26x_annex_b_bitstream_builder</text>
  <text x="60" y="583" font-size="10" fill="#37474f">• Drives VulkanVideoEncoderDpb</text>

  <!-- H265 delegate -->
  <rect x="440" y="440" width="320" height="155" rx="6" fill="url(#newG)" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">H265VulkanVideoEncoderDelegate</text>
  <text x="600" y="479" text-anchor="middle" font-size="10" fill="#1b5e20">media/gpu/vulkan/h265_vulkan_&#8230;  (NEW)</text>
  <text x="460" y="498" font-size="10" fill="#37474f">• Owns H265VPS / SPS / PPS</text>
  <text x="460" y="513" font-size="10" fill="#37474f">• Std twins: VPS/SPS/PPS + Slice</text>
  <text x="460" y="527" font-size="10" fill="#37474f">• Reuses h265_builder.h</text>
  <text x="460" y="541" font-size="10" fill="#37474f">• Reuses media/gpu/h265_dpb logic</text>
  <text x="460" y="555" font-size="10" fill="#37474f">• Up to T=3 temporal layers</text>
  <text x="460" y="569" font-size="10" fill="#37474f">• HEVC Main and Main10 profiles</text>
  <text x="460" y="583" font-size="10" fill="#37474f">• HW QP map + intra-refresh (opt.)</text>

  <!-- AV1 delegate -->
  <rect x="840" y="440" width="320" height="155" rx="6" fill="url(#newG)" stroke="#2e7d32" stroke-width="2"/>
  <text x="1000" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">AV1VulkanVideoEncoderDelegate</text>
  <text x="1000" y="479" text-anchor="middle" font-size="10" fill="#1b5e20">media/gpu/vulkan/av1_vulkan_&#8230;  (NEW)</text>
  <text x="860" y="498" font-size="10" fill="#37474f">• Driver emits all OBUs (simpler)</text>
  <text x="860" y="513" font-size="10" fill="#37474f">• Owns StdVideoAV1SequenceHeader</text>
  <text x="860" y="527" font-size="10" fill="#37474f">• Reuses av1_builder.h</text>
  <text x="860" y="541" font-size="10" fill="#37474f">• Up to T=3 + S=3 layers (SVC)</text>
  <text x="860" y="555" font-size="10" fill="#37474f">• Profile Main, 8/10-bit</text>
  <text x="860" y="569" font-size="10" fill="#37474f">• Tile-group output</text>

  <!-- Wrapper -->
  <line x1="600" y1="380" x2="380" y2="380" stroke="#37474f" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="40" y="620" width="500" height="110" rx="6" fill="url(#newG)" stroke="#2e7d32" stroke-width="2"/>
  <text x="290" y="643" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">VulkanVideoEncoderWrapper</text>
  <text x="290" y="660" text-anchor="middle" font-size="10" fill="#1b5e20">media/gpu/vulkan/vulkan_video_encoder_wrapper.{h,cc} (NEW)</text>
  <text x="60" y="680" font-size="10" fill="#37474f">• VkVideoSessionKHR + VkVideoSessionParametersKHR</text>
  <text x="60" y="694" font-size="10" fill="#37474f">• VulkanCommandBufferPool, BitstreamBuffer/Image pools</text>
  <text x="60" y="708" font-size="10" fill="#37474f">• Encode-feedback QueryPool (VK_QUERY_TYPE_VIDEO_ENCODE_FEEDBACK_KHR)</text>
  <text x="60" y="722" font-size="10" fill="#37474f">• vkCmdBeginVideoCodingKHR / ControlVideoCoding / EncodeVideo / EndVideoCoding</text>

  <!-- Reused components -->
  <rect x="600" y="620" width="560" height="110" rx="6" fill="url(#reuseG)" stroke="#e65100" stroke-width="2"/>
  <text x="880" y="643" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">Reused from existing media/gpu/</text>
  <text x="620" y="663" font-size="10" fill="#37474f">• media/gpu/h264_dpb.{h,cc}                                 — DPB + reference lists</text>
  <text x="620" y="677" font-size="10" fill="#37474f">• media/gpu/h264_ratectrl_rtc.{h,cc}                — Software bitrate controller</text>
  <text x="620" y="691" font-size="10" fill="#37474f">• media/gpu/h264_builder.{h,cc} + media/filters/h26x_annex_b_bitstream_builder.h</text>
  <text x="620" y="705" font-size="10" fill="#37474f">• media/parsers/h264_parser.h (types: H264SPS, H264PPS, H264SliceHeader)</text>
  <text x="620" y="719" font-size="10" fill="#37474f">• media/gpu/svc_layers.{h,cc}, gpu_video_encode_accelerator_helpers.h</text>
</svg>
