<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>

  <text x="45" y="36" font-size="20" font-weight="bold" fill="#263238">Ext API Surface Health — where the RC-1 findings land</text>
  <text x="45" y="58" font-size="11.5" fill="#546e7a">Green = works and is validated by a shipping consumer · Amber = works but stubbed/misleading · Red = broken, inert, or unreachable · Grey = unused by any consumer (unvalidated)</text>

  <!-- ============ CONSUMERS ============ -->
  <rect x="45" y="80" width="560" height="118" rx="10" fill="#f6f9ff" stroke="#64b5f6" stroke-width="2"/>
  <text x="60" y="102" font-size="12.5" font-weight="bold" fill="#1565c0">CONSUMER A — Chromium VulkanVideoEncodeAccelerator</text>
  <text x="60" y="121" font-size="10.5" fill="#37474f">BYO VkDevice (compositor's) · same-device SharedImage import</text>
  <text x="60" y="137" font-size="10.5" fill="#37474f">acquire/release semaphores from the SI representation</text>
  <text x="60" y="153" font-size="10.5" fill="#37474f">frameId = internal counter · output → renderer shmem</text>
  <text x="60" y="172" font-size="10.5" font-weight="bold" fill="#1565c0">Uses: InitializeExt · SubmitExternalFrame · GetEncodedFrame ·</text>
  <text x="60" y="188" font-size="10.5" font-weight="bold" fill="#1565c0">ReleaseEncodedFrame · DrainPendingFrames · Reconfigure · GetRuntimeInfo</text>

  <rect x="675" y="80" width="560" height="118" rx="10" fill="#f4fbf4" stroke="#81c784" stroke-width="2"/>
  <text x="690" y="102" font-size="12.5" font-weight="bold" fill="#2e7d32">CONSUMER B — ThreadedRenderingVk (TRV)</text>
  <text x="690" y="121" font-size="10.5" fill="#37474f">BYO VkInstance ONLY — library creates its own device</text>
  <text x="690" y="137" font-size="10.5" fill="#37474f">cross-device dma-buf / Win32 NT handle import</text>
  <text x="690" y="153" font-size="10.5" fill="#37474f">cross-device timeline semaphore export/import</text>
  <text x="690" y="172" font-size="10.5" font-weight="bold" fill="#2e7d32">Uses: + uniqueImageIndex (producer pool slot) ·</text>
  <text x="690" y="188" font-size="10.5" font-weight="bold" fill="#2e7d32">pStagingCompleteSemaphore (chains display blit after encode)</text>

  <text x="640" y="222" text-anchor="middle" font-size="11.5" font-style="italic" fill="#546e7a">Two structurally different device models through one unmodified interface — the strongest evidence the BYO decomposition is right. Keep the shape.</text>

  <!-- ============ API SURFACE MAP ============ -->
  <rect x="45" y="240" width="1190" height="330" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-width="2"/>
  <text x="60" y="263" font-size="13" font-weight="bold" fill="#37474f">PUBLIC Ext API SURFACE</text>

  <!-- WORKS column -->
  <rect x="62" y="278" width="270" height="278" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="197" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">WORKS + VALIDATED</text>
  <text x="76" y="321" font-size="10.5" fill="#37474f">InitializeExt() — BYO device/queue</text>
  <text x="76" y="339" font-size="10.5" fill="#37474f">SubmitExternalFrame() + residency</text>
  <text x="76" y="357" font-size="10.5" fill="#37474f">GetEncodedFrame() — frameId-keyed</text>
  <text x="76" y="375" font-size="10.5" fill="#37474f">ReleaseEncodedFrame()</text>
  <text x="76" y="393" font-size="10.5" fill="#37474f">DrainPendingFrames()</text>
  <text x="76" y="411" font-size="10.5" fill="#37474f">Flush()</text>
  <text x="76" y="429" font-size="10.5" fill="#37474f">Enumerate*Capabilities() ×4</text>
  <text x="76" y="447" font-size="10.5" fill="#37474f">GetVkDevice/PhysicalDevice/Instance</text>
  <text x="76" y="465" font-size="10.5" fill="#37474f">pStagingCompleteSemaphore</text>
  <text x="76" y="483" font-size="10.5" fill="#37474f">uniqueImageIndex (caller identity)</text>
  <text x="76" y="507" font-size="10" font-style="italic" fill="#2e7d32">per-frame VkResult; failed frames are</text>
  <text x="76" y="521" font-size="10" font-style="italic" fill="#2e7d32">DELIVERED not dropped — right call</text>
  <text x="76" y="541" font-size="10" font-style="italic" fill="#2e7d32">VK_NOT_READY as backpressure — right call</text>

  <!-- DEGRADED column -->
  <rect x="345" y="278" width="270" height="278" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
  <text x="480" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">STUBBED / MISLEADING</text>
  <text x="359" y="321" font-size="10.5" font-weight="bold" fill="#37474f">A6 GetMaxWidth/Height()</text>
  <text x="359" y="337" font-size="10" fill="#546e7a">hardcoded 8192, // TODO</text>
  <text x="359" y="359" font-size="10.5" font-weight="bold" fill="#37474f">A6 SupportsFormat()</text>
  <text x="359" y="375" font-size="10" fill="#546e7a">static switch, ignores the device</text>
  <text x="359" y="397" font-size="10.5" font-weight="bold" fill="#37474f">A7 GetRuntimeInfo() alignment</text>
  <text x="359" y="413" font-size="10" fill="#546e7a">hardcoded 16 — but 1080 % 16 = 8</text>
  <text x="359" y="427" font-size="10" fill="#546e7a">pictureAccessGranularity already exists</text>
  <text x="359" y="441" font-size="10" fill="#546e7a">in Capabilities — just not connected</text>
  <text x="359" y="463" font-size="10.5" font-weight="bold" fill="#37474f">A5 GetEncodedFrame FIFO gate</text>
  <text x="359" y="479" font-size="10" fill="#546e7a">head-of-line stall, no library timeout</text>
  <text x="359" y="493" font-size="10" fill="#546e7a">(capture map is ALREADY frameId-keyed)</text>
  <text x="359" y="515" font-size="10.5" font-weight="bold" fill="#37474f">A10 Deinitialize()</text>
  <text x="359" y="531" font-size="10" fill="#546e7a">dangles outstanding pBitstreamData</text>

  <!-- BROKEN column -->
  <rect x="628" y="278" width="270" height="278" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="763" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">BROKEN / INERT</text>
  <text x="642" y="321" font-size="10.5" font-weight="bold" fill="#37474f">A3 PollEncodeComplete()</text>
  <text x="642" y="337" font-size="10" fill="#546e7a">NOT_READY forever once ready —</text>
  <text x="642" y="351" font-size="10" fill="#546e7a">assembly worker nulls encodeCmdBuffer</text>
  <text x="642" y="373" font-size="10.5" font-weight="bold" fill="#37474f">A3 GetEncodeFence()</text>
  <text x="642" y="389" font-size="10" fill="#546e7a">NULL once ready + unguarded deref;</text>
  <text x="642" y="403" font-size="10" fill="#546e7a">the header's "thread pool" flow can't work</text>
  <text x="642" y="425" font-size="10.5" font-weight="bold" fill="#37474f">A1 8 config fields IGNORED</text>
  <text x="642" y="441" font-size="10" fill="#546e7a">VUI ×4 (blocks HDR), idrPeriod,</text>
  <text x="642" y="455" font-size="10" fill="#546e7a">closedGop, vbvBufferSize,</text>
  <text x="642" y="469" font-size="10" fill="#546e7a">enablePreprocessFilter</text>
  <text x="642" y="491" font-size="10.5" font-weight="bold" fill="#37474f">A2 RGBA preprocess filter</text>
  <text x="642" y="507" font-size="10" fill="#546e7a">unreachable on external input AND</text>
  <text x="642" y="521" font-size="10" fill="#546e7a">macro defined in NO build system</text>
  <text x="642" y="535" font-size="10" font-weight="bold" fill="#c62828">→ silent garbage output if trusted</text>

  <!-- CROSS-CUTTING column -->
  <rect x="911" y="278" width="308" height="278" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <text x="1065" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#311b92">CROSS-CUTTING</text>
  <text x="925" y="321" font-size="10.5" font-weight="bold" fill="#37474f">A0 "structured config" is argv</text>
  <text x="925" y="337" font-size="10" fill="#546e7a">struct → "--flag" strings → re-parsed.</text>
  <text x="925" y="351" font-size="10" fill="#546e7a">Root cause of A1/A2. A field is only</text>
  <text x="925" y="365" font-size="10" fill="#546e7a">expressible if a CLI flag exists for it.</text>
  <text x="925" y="387" font-size="10.5" font-weight="bold" fill="#37474f">A8 No versioning anywhere</text>
  <text x="925" y="403" font-size="10" fill="#546e7a">no sType/pNext, no structSize on any of</text>
  <text x="925" y="417" font-size="10" fill="#546e7a">the 5 public structs → any new field is</text>
  <text x="925" y="431" font-size="10" fill="#546e7a">an ABI break. std::vector across extern "C".</text>
  <text x="925" y="453" font-size="10.5" font-weight="bold" fill="#37474f">A4 No threading contract</text>
  <text x="925" y="469" font-size="10" fill="#546e7a">header invites a thread pool; only</text>
  <text x="925" y="483" font-size="10" fill="#546e7a">m_pendingFrames is guarded. Reconfigure</text>
  <text x="925" y="497" font-size="10" fill="#546e7a">races GetEncodedFrame today.</text>
  <text x="925" y="519" font-size="10.5" font-weight="bold" fill="#37474f">A9 uint32_t + magic numbers</text>
  <text x="925" y="535" font-size="10" fill="#546e7a">for rateControlMode / tuningMode</text>

  <!-- unvalidated banner -->
  <rect x="45" y="586" width="1190" height="46" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
  <text x="640" y="606" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#37474f">Every defect above sits in API that NO consumer calls. Unused API is unvalidated API.</text>
  <text x="640" y="623" text-anchor="middle" font-size="10.5" fill="#546e7a">Neither Chromium nor TRV exercises PollEncodeComplete, GetEncodeFence, SupportsFormat, GetMaxWidth/Height, or the ignored config fields — which is exactly why these survived to RC-1.</text>

  <!-- ============ IMPLEMENTATION QUALITY ============ -->
  <rect x="45" y="652" width="585" height="215" rx="10" fill="#f4fbf4" stroke="#81c784" stroke-width="2"/>
  <text x="60" y="675" font-size="12.5" font-weight="bold" fill="#2e7d32">LIBRARY (5 commits) — good; one fix matters beyond this project</text>
  <text x="60" y="697" font-size="10.5" font-weight="bold" fill="#1b5e20">939c71d: real H.264 conformance bug</text>
  <text x="60" y="713" font-size="10" fill="#37474f">m_max_dpb_size stored 17 unclamped while IsDpbFull() counts 16 →</text>
  <text x="60" y="727" font-size="10" fill="#37474f">DPB never full → Annex-C eviction never ran → ref set froze at 16 pics →</text>
  <text x="60" y="741" font-size="10" fill="#37474f">streams predict from evicted refs. Recon-clean, decode-corrupt drift.</text>
  <text x="60" y="755" font-size="10" font-weight="bold" fill="#1b5e20">Survives PSNR-vs-recon gates. Push upstream on its own merits.</text>
  <text x="60" y="777" font-size="10.5" fill="#37474f">✔ aab2077 BYO queue validation: range + flags + codec ops + cache refresh</text>
  <text x="60" y="793" font-size="10.5" fill="#37474f">✔ need-based DPB sizing reclaims ~12 full-res images at Level ≥ 5.0</text>
  <text x="60" y="809" font-size="10.5" fill="#37474f">✔ commit hygiene: every patch tagged "Local / Upstream candidate"</text>
  <text x="60" y="829" font-size="10.5" fill="#c62828">✗ VkThreadPool try/catch removed unconditionally — fatal in standalone too</text>
  <text x="60" y="845" font-size="10.5" fill="#c62828">✗ carried-patch set growing; push DPB + QFOT fixes upstream to shrink it</text>

  <rect x="650" y="652" width="585" height="215" rx="10" fill="#f6f9ff" stroke="#64b5f6" stroke-width="2"/>
  <text x="665" y="675" font-size="12.5" font-weight="bold" fill="#1565c0">CHROMIUM PORT (4 commits) — strongest part of the work</text>
  <text x="665" y="697" font-size="10.5" fill="#37474f">✔ backpressure: VK_NOT_READY → drain, retry once, park, re-kick</text>
  <text x="665" y="713" font-size="10.5" fill="#37474f">✔ re-entrancy guard for sync clients calling back into the drain</text>
  <text x="665" y="729" font-size="10.5" fill="#37474f">✔ stall watchdog — consumer-side mitigation for the library's A5</text>
  <text x="665" y="745" font-size="10.5" fill="#37474f">✔ per-frame errors release slot + zero-copy hold BEFORE raising</text>
  <text x="665" y="761" font-size="10.5" fill="#37474f">✔ hold-to-completion for zero-copy input (fixed Xid 31 device-lost)</text>
  <text x="665" y="777" font-size="10.5" fill="#37474f">✔ 44 unit tests + fake library → state machine testable without a GPU</text>
  <text x="665" y="793" font-size="10.5" fill="#37474f">✔ RequestEncodingParametersChange wired; resolution change REFUSED</text>
  <text x="665" y="809" font-size="10.5" fill="#37474f">✔ defense-in-depth for release builds where DCHECK is stripped</text>
  <text x="665" y="829" font-size="10.5" fill="#ef6c00">~ stripped "audit M2 / (audit )" markers; stale Reconfigure comment</text>
  <text x="665" y="845" font-size="10.5" fill="#ef6c00">~ carries the hardcoded alignment-16 through to VideoEncoderInfo</text>

  <text x="640" y="886" text-anchor="middle" font-size="10.5" fill="#78909c">Blocking before the Ext API is called stable: A3 (fix or delete broken methods) · A1 (forward-or-reject every field) · A2 (RGBA honesty) · A8 (versioning) · A4 (threading contract)</text>
</svg>
