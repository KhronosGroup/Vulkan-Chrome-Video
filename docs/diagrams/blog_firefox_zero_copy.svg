<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="rddG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="dmaB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>
    <linearGradient id="cmpB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbdefb"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>
    <marker id="fa" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>

  <text x="640" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">
    Firefox: Zero-Copy Vulkan Video Decode, End to End
  </text>
  <text x="640" y="56" text-anchor="middle" font-size="12" fill="#546e7a">
    Decoded frames never touch system memory: VkImage → DRM-modifier DMA-buf → sandbox IPC → EGL/OpenGL import → WebRender composite.
  </text>

  <!-- ============ RDD PROCESS ============ -->
  <rect x="30" y="90" width="560" height="330" rx="10" fill="#f4fbf4" stroke="#81c784" stroke-width="2"/>
  <text x="50" y="114" font-size="13" font-weight="bold" fill="#2e7d32">RDD PROCESS (sandboxed media decoder)</text>

  <rect x="60" y="130" width="500" height="86" rx="8" fill="url(#rddG)" stroke="#388e3c"/>
  <text x="310" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">FFmpeg Vulkan Video decoder</text>
  <text x="310" y="176" text-anchor="middle" font-size="11" fill="#37474f">hardware decode of H.264 / H.265 / AV1 via Vulkan Video</text>
  <text x="310" y="194" text-anchor="middle" font-size="11" fill="#37474f">output: a VkImage, GPU-resident</text>

  <rect x="60" y="236" width="500" height="86" rx="8" fill="url(#dmaB)" stroke="#f9a825" stroke-width="2"/>
  <text x="310" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#5d4037">Export as DMA-buf</text>
  <text x="310" y="282" text-anchor="middle" font-size="11" fill="#37474f">per-plane FDs + explicit DRM format modifier</text>
  <text x="310" y="300" text-anchor="middle" font-size="11" fill="#37474f">+ synchronization so the consumer waits on decode completion</text>

  <rect x="60" y="342" width="500" height="62" rx="8" fill="#eef7ff" stroke="#66bb6a" stroke-dasharray="5,3"/>
  <text x="310" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e7d32">Engineered for real browsing</text>
  <text x="310" y="386" text-anchor="middle" font-size="11" fill="#37474f">one shared GPU device across decoders — many video tabs decode in parallel</text>

  <!-- ============ SANDBOX BOUNDARY ============ -->
  <rect x="620" y="90" width="60" height="330" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="650" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f" transform="rotate(-90 650 255)">SANDBOX BOUNDARY — FD passing over IPC</text>

  <!-- ============ COMPOSITOR ============ -->
  <rect x="710" y="90" width="540" height="330" rx="10" fill="#f6f9ff" stroke="#64b5f6" stroke-width="2"/>
  <text x="730" y="114" font-size="13" font-weight="bold" fill="#1565c0">GPU / COMPOSITOR PROCESS</text>

  <rect x="740" y="130" width="480" height="86" rx="8" fill="url(#cmpB)" stroke="#1976d2"/>
  <text x="980" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">GL / EGL direct import</text>
  <text x="980" y="176" text-anchor="middle" font-size="11" fill="#37474f">DMA-buf FDs → EGLImage → GL texture (import by modifier)</text>
  <text x="980" y="194" text-anchor="middle" font-size="11" fill="#37474f">OpenGL samples the decoded surface directly — no readback, no upload</text>

  <rect x="740" y="236" width="480" height="86" rx="8" fill="url(#cmpB)" stroke="#1976d2"/>
  <text x="980" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">WebRender composite → display</text>
  <text x="980" y="282" text-anchor="middle" font-size="11" fill="#37474f">YCbCr sampled and color-converted at composite time</text>
  <text x="980" y="300" text-anchor="middle" font-size="11" fill="#37474f">correct cross-process sync via the exported semaphore/fence chain</text>

  <rect x="740" y="342" width="480" height="62" rx="8" fill="#eef7ff" stroke="#64b5f6" stroke-dasharray="5,3"/>
  <text x="980" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1565c0">Robust across GPU vendors</text>
  <text x="980" y="386" text-anchor="middle" font-size="11" fill="#37474f">per-vendor DMA-buf plane-format handling (NVIDIA / AMD / Intel)</text>

  <line x1="310" y1="216" x2="310" y2="236" stroke="#37474f" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="560" y1="279" x2="740" y2="173" stroke="#37474f" stroke-width="2.5" marker-end="url(#fa)"/>
  <line x1="980" y1="216" x2="980" y2="236" stroke="#37474f" stroke-width="2" marker-end="url(#fa)"/>

  <!-- ============ STATUS STRIP ============ -->
  <rect x="30" y="440" width="1220" height="60" rx="10" fill="#f4fbf4" stroke="#81c784" stroke-width="2"/>
  <text x="640" y="464" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e7d32">Status — Firefox Bug 2021722 + FFmpeg upstream</text>
  <text x="640" y="485" text-anchor="middle" font-size="11" fill="#37474f">Framework groundwork merged (Vulkan headers, GTK/packaging hooks, GL/EGL + compositor IPC, DMA-buf formats) · FFmpeg modifier-export fixes merged · decoder and sandbox policy in final review</text>
</svg>
