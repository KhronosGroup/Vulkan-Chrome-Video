<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400">
  <defs>
    <linearGradient id="vulkanDecGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glCompGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dmabufGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="650" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="325" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Current State: OpenGL Compositor</text>
  
  <!-- Left column: Vulkan Video Decoder -->
  <rect x="40" y="60" width="200" height="320" rx="10" fill="url(#vulkanDecGrad)" opacity="0.1"/>
  <rect x="40" y="60" width="200" height="320" rx="10" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">Vulkan Video Decoder</text>
  
  <!-- VkImage box -->
  <rect x="60" y="110" width="160" height="45" rx="6" fill="#fff" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">VkImage</text>
  <text x="140" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B5CF6">(decoded frame)</text>
  
  <!-- Arrow down -->
  <line x1="140" y1="155" x2="140" y2="175" stroke="#8B5CF6" stroke-width="2"/>
  <polygon points="140,180 135,170 145,170" fill="#8B5CF6"/>
  
  <!-- Export as DMA-BUF -->
  <rect x="60" y="185" width="160" height="40" rx="6" fill="url(#dmabufGrad)"/>
  <text x="140" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Export as DMA-BUF</text>
  
  <!-- Right column: OpenGL Compositor -->
  <rect x="410" y="60" width="200" height="320" rx="10" fill="url(#glCompGrad)" opacity="0.1"/>
  <rect x="410" y="60" width="200" height="320" rx="10" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <text x="510" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">OpenGL Compositor</text>
  
  <!-- DMA-BUF arrow across -->
  <line x1="220" y1="205" x2="400" y2="205" stroke="#F97316" stroke-width="3"/>
  <polygon points="405,205 392,198 392,212" fill="#F97316"/>
  <rect x="270" y="190" width="80" height="25" rx="4" fill="#fff" stroke="#F97316" stroke-width="1.5"/>
  <text x="310" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">DMA-BUF</text>
  
  <!-- EGLImage import -->
  <rect x="430" y="185" width="160" height="40" rx="6" fill="#fff" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="510" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">EGLImage import</text>
  
  <!-- Arrow down -->
  <line x1="510" y1="225" x2="510" y2="245" stroke="#3B82F6" stroke-width="2"/>
  <polygon points="510,250 505,240 515,240" fill="#3B82F6"/>
  
  <!-- GL texture -->
  <rect x="430" y="255" width="160" height="40" rx="6" fill="#fff" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="510" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">GL texture</text>
  
  <!-- Arrow down -->
  <line x1="510" y1="295" x2="510" y2="315" stroke="#3B82F6" stroke-width="2"/>
  <polygon points="510,320 505,310 515,310" fill="#3B82F6"/>
  
  <!-- Draw to screen -->
  <rect x="430" y="325" width="160" height="40" rx="6" fill="url(#glCompGrad)"/>
  <text x="510" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Draw to screen</text>
  
  <!-- Note -->
  <text x="325" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Cross-API sync handled via DMA-BUF implicit synchronization</text>
</svg>

