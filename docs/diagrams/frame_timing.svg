<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280">
  <defs>
    <linearGradient id="drawGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="presentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="750" height="280" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Frame Timing</text>
  
  <!-- Timeline arrow -->
  <line x1="40" y1="80" x2="710" y2="80" stroke="#64748b" stroke-width="2"/>
  <polygon points="715,80 705,75 705,85" fill="#64748b"/>
  <text x="725" y="84" font-family="Arial, sans-serif" font-size="10" fill="#64748b">t</text>
  
  <!-- VSync markers -->
  <line x1="100" y1="60" x2="100" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748b">VSync 0</text>
  
  <line x1="250" y1="60" x2="250" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748b">VSync 1</text>
  
  <line x1="400" y1="60" x2="400" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748b">VSync 2</text>
  
  <line x1="550" y1="60" x2="550" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="550" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748b">VSync 3</text>
  
  <!-- Frame N -->
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Frame N</text>
  
  <!-- Draw Frame N -->
  <rect x="100" y="120" width="140" height="30" rx="4" fill="url(#drawGrad)"/>
  <text x="170" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Draw</text>
  
  <!-- Arrow from Draw to Present -->
  <line x1="240" y1="135" x2="248" y2="135" stroke="#64748b" stroke-width="2"/>
  <polygon points="253,135 245,130 245,140" fill="#64748b"/>
  
  <!-- Present Frame N -->
  <rect x="255" y="120" width="140" height="30" rx="4" fill="url(#presentGrad)"/>
  <text x="325" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Present</text>
  
  <!-- Frame N+1 -->
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Frame N+1</text>
  
  <!-- Draw Frame N+1 -->
  <rect x="250" y="190" width="140" height="30" rx="4" fill="url(#drawGrad)"/>
  <text x="320" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Draw</text>
  
  <!-- Arrow from Draw to Present -->
  <line x1="390" y1="205" x2="398" y2="205" stroke="#64748b" stroke-width="2"/>
  <polygon points="403,205 395,200 395,210" fill="#64748b"/>
  
  <!-- Present Frame N+1 -->
  <rect x="405" y="190" width="140" height="30" rx="4" fill="url(#presentGrad)"/>
  <text x="475" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Present</text>
  
  <!-- Legend -->
  <rect x="600" y="110" width="130" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="615" y="125" width="20" height="12" rx="2" fill="url(#drawGrad)"/>
  <text x="645" y="135" font-family="Arial, sans-serif" font-size="10" fill="#475569">Draw (GPU)</text>
  <rect x="615" y="145" width="20" height="12" rx="2" fill="url(#presentGrad)"/>
  <text x="645" y="155" font-family="Arial, sans-serif" font-size="10" fill="#475569">Present (Display)</text>
  
  <!-- Timing note -->
  <text x="375" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Double-buffered: Draw current frame while previous is displayed</text>
  <text x="375" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">VSync interval typically 16.67ms (60Hz) or 8.33ms (120Hz)</text>
</svg>

