<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vulkanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="750" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">
    DMA-BUF File Descriptor Export/Import Architecture
  </text>
  
  <!-- User Space Section -->
  <rect x="40" y="60" width="1020" height="310" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">User Space (Chromium GPU Process)</text>
  
  <!-- Decoder Box -->
  <rect x="60" y="100" width="280" height="240" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Video Decoder</text>
  
  <!-- VA-API Path -->
  <rect x="80" y="140" width="110" height="70" rx="6" fill="url(#userGrad)" filter="url(#shadow)"/>
  <text x="135" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">VaapiWrapper</text>
  <text x="135" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dbeafe">VASurfaceID</text>
  <text x="135" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dbeafe">vaExportSurface</text>
  
  <!-- Vulkan Path -->
  <rect x="210" y="140" width="110" height="70" rx="6" fill="url(#vulkanGrad)" filter="url(#shadow)"/>
  <text x="265" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">VulkanWrapper</text>
  <text x="265" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ede9fe">VkImage</text>
  <text x="265" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ede9fe">vkGetMemoryFd</text>
  
  <!-- FD Export Box -->
  <rect x="80" y="220" width="240" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e">DMA-BUF FD Export</text>
  <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b45309">int dmabuf_fd = dup(exported_fd)</text>
  
  <!-- NativePixmap -->
  <rect x="80" y="280" width="240" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">gfx::NativePixmapDmaBuf</text>
  <text x="200" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#15803d">Wraps DMA-BUF FDs</text>
  
  <!-- FrameResource -->
  <rect x="380" y="100" width="280" height="120" rx="8" fill="#fff" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">NativePixmapFrameResource</text>
  <text x="520" y="148" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">media/gpu/chromeos/</text>
  
  <text x="400" y="170" font-family="monospace" font-size="9" fill="#475569">NumDmabufFds(): size_t</text>
  <text x="400" y="185" font-family="monospace" font-size="9" fill="#475569">GetDmabufFd(i): int</text>
  <text x="400" y="200" font-family="monospace" font-size="9" fill="#475569">CreateDmabufVideoFrame()</text>
  
  <!-- MailboxConverter -->
  <rect x="380" y="240" width="280" height="100" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">MailboxVideoFrameConverter</text>
  <text x="520" y="288" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">media/gpu/chromeos/</text>
  
  <text x="400" y="310" font-family="monospace" font-size="9" fill="#475569">SharedImageInterface::CreateSharedImage(</text>
  <text x="400" y="325" font-family="monospace" font-size="9" fill="#475569">  pixmap->CloneHandleForIPC())</text>
  
  <!-- Display/Compositor -->
  <rect x="700" y="100" width="340" height="240" rx="8" fill="#fff" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2410c">Display / Compositor</text>
  
  <!-- SharedImage -->
  <rect x="720" y="140" width="140" height="70" rx="6" fill="#fed7aa" stroke="#f97316" stroke-width="1"/>
  <text x="790" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">SharedImage</text>
  <text x="790" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ea580c">GPU Mailbox</text>
  <text x="790" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ea580c">Texture Handle</text>
  
  <!-- EGLImage -->
  <rect x="880" y="140" width="140" height="70" rx="6" fill="#fde68a" stroke="#eab308" stroke-width="1"/>
  <text x="950" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#a16207">EGLImage</text>
  <text x="950" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ca8a04">EGL_LINUX_DMA_BUF</text>
  <text x="950" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ca8a04">Zero-copy import</text>
  
  <!-- DRM Overlay -->
  <rect x="720" y="230" width="140" height="70" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="790" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">DRM Overlay</text>
  <text x="790" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dc2626">drmModeSetPlane()</text>
  <text x="790" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dc2626">Direct scanout</text>
  
  <!-- VkImage Import -->
  <rect x="880" y="230" width="140" height="70" rx="6" fill="url(#vulkanGrad)"/>
  <text x="950" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">VkImage Import</text>
  <text x="950" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ede9fe">VK_EXT_external</text>
  <text x="950" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ede9fe">_memory_dma_buf</text>
  
  <!-- Kernel Space Section -->
  <rect x="40" y="390" width="1020" height="180" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">Kernel Space</text>
  
  <!-- DMA-BUF Subsystem -->
  <rect x="300" y="430" width="500" height="120" rx="8" fill="#fff" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">DMA-BUF Subsystem</text>
  
  <text x="320" y="480" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• Reference counting across processes</text>
  <text x="320" y="498" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• Implicit synchronization (fence signaling)</text>
  <text x="320" y="516" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• Memory pinning for DMA operations</text>
  <text x="320" y="534" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• Scatter-gather list management</text>
  
  <text x="580" y="480" font-family="monospace" font-size="9" fill="#475569">DMA_BUF_IOCTL_EXPORT_SYNC_FILE</text>
  <text x="580" y="498" font-family="monospace" font-size="9" fill="#475569">DMA_BUF_IOCTL_IMPORT_SYNC_FILE</text>
  <text x="580" y="516" font-family="monospace" font-size="9" fill="#475569">struct dma_buf *dmabuf;</text>
  <text x="580" y="534" font-family="monospace" font-size="9" fill="#475569">struct dma_fence *fence;</text>
  
  <!-- GPU Memory Section -->
  <rect x="40" y="590" width="1020" height="140" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="615" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#065f46">GPU Video Memory</text>
  
  <!-- Physical Memory Block -->
  <rect x="150" y="635" width="800" height="80" rx="8" fill="url(#gpuGrad)" filter="url(#shadow)"/>
  <text x="550" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">
    Physical GPU Memory Pages (VRAM / Shared Memory)
  </text>
  <text x="550" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5">
    Same physical pages accessed by: Decoder → Compositor → Display Controller
  </text>
  
  <!-- Arrows -->
  <!-- Decoder to FD Export -->
  <line x1="200" y1="210" x2="200" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- FD Export to NativePixmap -->
  <line x1="200" y1="270" x2="200" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- NativePixmap to FrameResource -->
  <path d="M 320 305 Q 350 305 350 180 Q 350 160 380 160" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- FrameResource to MailboxConverter -->
  <line x1="520" y1="220" x2="520" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- MailboxConverter to Display -->
  <line x1="660" y1="290" x2="700" y2="175" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="290" x2="700" y2="265" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- User to Kernel -->
  <line x1="200" y1="340" x2="200" y2="380" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="200" y1="380" x2="400" y2="450" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  
  <line x1="870" y1="340" x2="870" y2="380" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="870" y1="380" x2="700" y2="450" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  
  <!-- Kernel to GPU -->
  <line x1="550" y1="550" x2="550" y2="635" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  
  <!-- Legend -->
  <rect x="40" y="735" width="500" height="12" rx="4" fill="#10b981"/>
  <text x="290" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">
    ZERO-COPY: Same physical memory used throughout the pipeline - no pixel data copies!
  </text>
  
  <!-- FD Flow Labels -->
  <text x="185" y="375" font-family="Arial, sans-serif" font-size="9" fill="#ef4444" transform="rotate(-45 185 375)">FD passed via ioctl</text>
  <text x="855" y="375" font-family="Arial, sans-serif" font-size="9" fill="#ef4444" transform="rotate(45 855 375)">FD imported</text>
</svg>

