<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cdmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vulkanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="protectedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <!-- Lock icon -->
    <symbol id="lock" viewBox="0 0 20 20">
      <rect x="3" y="8" width="14" height="10" rx="2" fill="currentColor"/>
      <path d="M6 8V6a4 4 0 1 1 8 0v2" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <!-- Shield icon -->
    <symbol id="shield" viewBox="0 0 24 24">
      <path d="M12 2L4 6v6c0 5.5 3.5 10 8 11 4.5-1 8-5.5 8-11V6l-8-4z" fill="currentColor"/>
    </symbol>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Vulkan Video Protected Content Flow (Current Architecture)</text>
  <text x="500" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">CDM decrypts to protected buffer - Decoder is crypto-agnostic</text>
  
  <!-- Browser/CDM Section -->
  <rect x="40" y="80" width="920" height="150" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">Browser / CDM Process</text>
  
  <!-- Encrypted Stream Input -->
  <rect x="60" y="120" width="180" height="90" rx="8" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <use xlink:href="#lock" x="170" y="125" width="16" height="16" fill="#fff"/>
  <text x="150" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Encrypted Stream</text>
  <text x="150" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">CENC/CBCS encrypted</text>
  <text x="150" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">NAL units</text>
  
  <!-- Widevine CDM -->
  <rect x="290" y="120" width="200" height="90" rx="8" fill="url(#cdmGrad)" filter="url(#shadow)"/>
  <use xlink:href="#lock" x="420" y="125" width="16" height="16" fill="#fff"/>
  <text x="390" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Widevine CDM</text>
  <text x="390" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">License - Keys</text>
  <text x="390" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">AES Decryption</text>
  
  <!-- Decrypted to Protected Buffer -->
  <rect x="540" y="120" width="200" height="90" rx="8" fill="url(#protectedGrad)" filter="url(#shadow)"/>
  <use xlink:href="#shield" x="670" y="125" width="16" height="16" fill="#fff"/>
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Protected VkBuffer</text>
  <text x="640" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">Decrypted bitstream</text>
  <text x="640" y="187" text-anchor="middle" font-family="monospace" font-size="9" fill="#dcfce7">VK_MEMORY_PROPERTY</text>
  <text x="640" y="202" text-anchor="middle" font-family="monospace" font-size="9" fill="#dcfce7">_PROTECTED_BIT</text>
  
  <!-- Key Point Box -->
  <rect x="770" y="120" width="170" height="90" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="855" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b45309">Key Point:</text>
  <text x="855" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">CDM handles ALL</text>
  <text x="855" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">decryption before</text>
  <text x="855" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">reaching decoder</text>
  
  <!-- GPU Process Section -->
  <rect x="40" y="250" width="920" height="200" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">GPU Process - Vulkan Video Decoder</text>
  
  <!-- Protected Queue -->
  <rect x="60" y="295" width="180" height="70" rx="8" fill="url(#vulkanGrad)" filter="url(#shadow)"/>
  <text x="150" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Protected Queue</text>
  <text x="150" y="345" text-anchor="middle" font-family="monospace" font-size="9" fill="#ede9fe">VK_DEVICE_QUEUE_CREATE</text>
  <text x="150" y="358" text-anchor="middle" font-family="monospace" font-size="9" fill="#ede9fe">_PROTECTED_BIT</text>
  
  <!-- Protected Command Buffer -->
  <rect x="270" y="295" width="180" height="70" rx="8" fill="url(#vulkanGrad)" filter="url(#shadow)"/>
  <text x="360" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Protected CmdBuffer</text>
  <text x="360" y="345" text-anchor="middle" font-family="monospace" font-size="9" fill="#ede9fe">VK_COMMAND_POOL_CREATE</text>
  <text x="360" y="358" text-anchor="middle" font-family="monospace" font-size="9" fill="#ede9fe">_PROTECTED_BIT</text>
  
  <!-- Video Decoder -->
  <rect x="480" y="295" width="220" height="70" rx="8" fill="url(#vulkanGrad)" filter="url(#shadow)"/>
  <text x="590" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">vkCmdDecodeVideoKHR</text>
  <text x="590" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ede9fe">srcBuffer = protected_bitstream</text>
  <text x="590" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ede9fe">NO encryption params!</text>
  
  <!-- Output Image -->
  <rect x="730" y="295" width="210" height="70" rx="8" fill="url(#protectedGrad)" filter="url(#shadow)"/>
  <use xlink:href="#shield" x="870" y="300" width="14" height="14" fill="#fff"/>
  <text x="835" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Protected VkImage</text>
  <text x="835" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">Decoded frame output</text>
  <text x="835" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">in protected memory</text>
  
  <!-- Crypto Agnostic Highlight -->
  <rect x="200" y="385" width="560" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Decoder is CRYPTO-AGNOSTIC - just reads from protected buffer, writes to protected image</text>
  <text x="480" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#15803d">No VAEncryptionParameters equivalent needed!</text>
  
  <!-- Display Section -->
  <rect x="40" y="470" width="920" height="120" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#059669">Display Output</text>
  
  <!-- Compositor -->
  <rect x="200" y="510" width="250" height="60" rx="8" fill="url(#protectedGrad)" filter="url(#shadow)"/>
  <text x="325" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Compositor (Protected Queue)</text>
  <text x="325" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">Or direct overlay scanout</text>
  
  <!-- HDCP -->
  <rect x="550" y="510" width="200" height="60" rx="8" fill="url(#secureGrad)" filter="url(#shadow)"/>
  <use xlink:href="#lock" x="680" y="515" width="14" height="14" fill="#fff"/>
  <text x="650" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">HDCP Encryption</text>
  <text x="650" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fecaca">Protected link to display</text>
  
  <!-- Arrows -->
  <!-- Encrypted to CDM -->
  <line x1="240" y1="165" x2="290" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- CDM to Protected Buffer -->
  <line x1="490" y1="165" x2="540" y2="165" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="515" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#059669">decrypt</text>
  
  <!-- Protected Buffer to Decoder -->
  <line x1="640" y1="210" x2="640" y2="240" stroke="#7c3aed" stroke-width="2"/>
  <line x1="640" y1="240" x2="590" y2="295" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  
  <!-- Queue flow -->
  <line x1="240" y1="330" x2="270" y2="330" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="450" y1="330" x2="480" y2="330" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="700" y1="330" x2="730" y2="330" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- To display -->
  <line x1="835" y1="365" x2="835" y2="460" stroke="#059669" stroke-width="2"/>
  <line x1="835" y1="460" x2="325" y2="460" stroke="#059669" stroke-width="2"/>
  <line x1="325" y1="460" x2="325" y2="510" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <line x1="450" y1="540" x2="550" y2="540" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Security Boundary Legend -->
  <rect x="40" y="610" width="920" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="635" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Security Boundary:</text>
  
  <rect x="200" y="620" width="20" height="20" rx="4" fill="url(#protectedGrad)"/>
  <text x="230" y="635" font-family="Arial, sans-serif" font-size="11" fill="#475569">Protected Memory (VK_MEMORY_PROPERTY_PROTECTED_BIT)</text>
  
  <text x="60" y="660" font-family="Arial, sans-serif" font-size="11" fill="#475569">Decrypted content only exists in protected memory | Unprivileged code cannot read protected memory | Keys handled entirely by CDM</text>
</svg>
