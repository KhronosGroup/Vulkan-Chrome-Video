<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="phase1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#0d6efd;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="driverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#495057;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#495057;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#212529">VulkanVideoDecoder Architecture</text>
  
  <!-- Main container -->
  <rect x="40" y="50" width="720" height="240" rx="12" fill="url(#phase1Gradient)" stroke="#0d6efd" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#0d6efd">VulkanVideoDecoder</text>
  
  <!-- Top row components -->
  <g transform="translate(60, 95)">
    <!-- Session Manager -->
    <rect width="200" height="70" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <rect width="200" height="4" rx="2" fill="#0d6efd"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Session Manager</text>
    <text x="100" y="50" text-anchor="middle" font-size="10" fill="#6c757d">VkVideoSessionKHR</text>
  </g>
  
  <g transform="translate(300, 95)">
    <!-- Parameters Cache -->
    <rect width="200" height="70" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <rect width="200" height="4" rx="2" fill="#198754"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Parameters Cache</text>
    <text x="100" y="50" text-anchor="middle" font-size="10" fill="#6c757d">SPS/PPS/VPS Storage</text>
  </g>
  
  <g transform="translate(540, 95)">
    <!-- Command Processor -->
    <rect width="200" height="70" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <rect width="200" height="4" rx="2" fill="#fd7e14"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Command Processor</text>
    <text x="100" y="50" text-anchor="middle" font-size="10" fill="#6c757d">vkCmdDecodeVideoKHR</text>
  </g>
  
  <!-- Bottom row components -->
  <g transform="translate(60, 185)">
    <!-- DPB Manager -->
    <rect width="200" height="70" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <rect width="200" height="4" rx="2" fill="#6f42c1"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">DPB Manager</text>
    <text x="100" y="50" text-anchor="middle" font-size="10" fill="#6c757d">Reference Frame Pool</text>
  </g>
  
  <g transform="translate(300, 185)">
    <!-- Bitstream Buffer -->
    <rect width="200" height="70" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <rect width="200" height="4" rx="2" fill="#dc3545"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Bitstream Buffer</text>
    <text x="100" y="50" text-anchor="middle" font-size="10" fill="#6c757d">Compressed Data Input</text>
  </g>
  
  <g transform="translate(540, 185)">
    <!-- Output Frame Pool -->
    <rect width="200" height="70" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <rect width="200" height="4" rx="2" fill="#0dcaf0"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Output Frame Pool</text>
    <text x="100" y="50" text-anchor="middle" font-size="10" fill="#6c757d">DMA-BUF Export</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M400 295 L400 315" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
  </defs>
  
  <!-- Driver layer -->
  <rect x="40" y="320" width="720" height="60" rx="12" fill="url(#driverGradient)" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#495057">Vulkan Driver (libvulkan)</text>
  <text x="400" y="365" text-anchor="middle" font-size="11" fill="#6c757d">VK_KHR_video_decode_queue + codec extensions</text>
</svg>

