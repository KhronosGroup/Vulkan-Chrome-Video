<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="1280" height="560" fill="#ffffff"/>

  <text x="45" y="34" font-size="20" font-weight="700" fill="#0b0b0b">What hardware encode buys — benchmarks coming soon</text>
  <text x="45" y="56" font-size="12" fill="#52514e">The KPIs we are measuring across everyday use cases: software encode on the CPU vs the Vulkan Video backend. Figures publish with the upstream Chromium CLs.</text>

  <!-- column headers -->
  <text x="620" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Software encode (CPU)</text>
  <text x="620" y="112" text-anchor="middle" font-size="10" fill="#898781">reference baseline</text>
  <text x="880" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#008300">Vulkan Video (HW)</text>
  <text x="880" y="112" text-anchor="middle" font-size="10" fill="#898781">this initiative</text>
  <text x="1075" y="98" font-size="12" font-weight="700" fill="#52514e">Why it matters</text>
  <line x1="45" y1="122" x2="1235" y2="122" stroke="#c3c2b7" stroke-width="1"/>

  <!-- metric rows: each has a "measuring" pill in both condition columns -->
  <!-- Row 1 -->
  <g>
    <text x="45" y="152" font-size="12.5" font-weight="700" fill="#0b0b0b">Browser CPU while encoding</text>
    <text x="45" y="169" font-size="10.5" fill="#898781">% of a core, 1080p30 video call &amp; 4K30 tab recording</text>
    <rect x="530" y="142" width="180" height="26" rx="13" fill="#f2f1ee" stroke="#c3c2b7"/>
    <text x="620" y="159" text-anchor="middle" font-size="11" fill="#898781">measurement pending</text>
    <rect x="790" y="142" width="180" height="26" rx="13" fill="#f2f1ee" stroke="#c3c2b7"/>
    <text x="880" y="159" text-anchor="middle" font-size="11" fill="#898781">measurement pending</text>
    <text x="1000" y="159" font-size="11" fill="#52514e">Frees CPU cores that software codecs peg during every call</text>
  </g>
  <line x1="45" y1="184" x2="1235" y2="184" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row 2 -->
  <g>
    <text x="45" y="214" font-size="12.5" font-weight="700" fill="#0b0b0b">CPU package power above idle</text>
    <text x="45" y="231" font-size="10.5" fill="#898781">watts (RAPL), sustained encode</text>
    <rect x="530" y="204" width="180" height="26" rx="13" fill="#f2f1ee" stroke="#c3c2b7"/>
    <text x="620" y="221" text-anchor="middle" font-size="11" fill="#898781">measurement pending</text>
    <rect x="790" y="204" width="180" height="26" rx="13" fill="#f2f1ee" stroke="#c3c2b7"/>
    <text x="880" y="221" text-anchor="middle" font-size="11" fill="#898781">measurement pending</text>
    <text x="1000" y="221" font-size="11" fill="#52514e">Battery life and thermal headroom on laptops and fanless devices</text>
  </g>
  <line x1="45" y1="246" x2="1235" y2="246" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row 3 -->
  <g>
    <text x="45" y="276" font-size="12.5" font-weight="700" fill="#0b0b0b">Frame-transport memory traffic</text>
    <text x="45" y="293" font-size="10.5" fill="#898781">CPU bytes moved per frame, capture → encoder</text>
    <rect x="530" y="266" width="180" height="26" rx="13" fill="#f2f1ee" stroke="#c3c2b7"/>
    <text x="620" y="283" text-anchor="middle" font-size="11" fill="#898781">measurement pending</text>
    <rect x="790" y="266" width="180" height="26" rx="13" fill="#e6f4e6" stroke="#008300"/>
    <text x="880" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#008300">0 by design (zero-copy)</text>
    <text x="1000" y="283" font-size="11" fill="#52514e">All-GPU lane never copies frames through system memory</text>
  </g>
  <line x1="45" y1="308" x2="1235" y2="308" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row 4 -->
  <g>
    <text x="45" y="338" font-size="12.5" font-weight="700" fill="#0b0b0b">Encode latency (p50 / p99)</text>
    <text x="45" y="355" font-size="10.5" fill="#898781">milliseconds per frame, real-time modes</text>
    <rect x="530" y="328" width="180" height="26" rx="13" fill="#f2f1ee" stroke="#c3c2b7"/>
    <text x="620" y="345" text-anchor="middle" font-size="11" fill="#898781">measurement pending</text>
    <rect x="790" y="328" width="180" height="26" rx="13" fill="#f2f1ee" stroke="#c3c2b7"/>
    <text x="880" y="345" text-anchor="middle" font-size="11" fill="#898781">measurement pending</text>
    <text x="1000" y="345" font-size="11" fill="#52514e">Call responsiveness and glass-to-glass delay</text>
  </g>
  <line x1="45" y1="368" x2="1235" y2="368" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row 5 -->
  <g>
    <text x="45" y="398" font-size="12.5" font-weight="700" fill="#0b0b0b">Output quality at target bitrate</text>
    <text x="45" y="415" font-size="10.5" fill="#898781">PSNR / SSIM / BD-rate vs reference</text>
    <rect x="530" y="388" width="180" height="26" rx="13" fill="#f2f1ee" stroke="#c3c2b7"/>
    <text x="620" y="405" text-anchor="middle" font-size="11" fill="#898781">measurement pending</text>
    <rect x="790" y="388" width="180" height="26" rx="13" fill="#f2f1ee" stroke="#c3c2b7"/>
    <text x="880" y="405" text-anchor="middle" font-size="11" fill="#898781">measurement pending</text>
    <text x="1000" y="405" font-size="11" fill="#52514e">Parity or better against the software encoder</text>
  </g>

  <!-- Established-today strip (functional facts, not performance) -->
  <rect x="45" y="438" width="1190" height="60" rx="10" fill="#f0fdf4" stroke="#008300" stroke-opacity="0.35"/>
  <text x="62" y="461" font-size="12" font-weight="700" fill="#1b5e20">Established on the dev branch today (functional, not performance):</text>
  <text x="62" y="481" font-size="11" fill="#37474f">• the zero-copy input path is verified bit-identical to the software staging reference (md5), validation-layer clean · • the all-GPU</text>
  <text x="62" y="495" font-size="11" fill="#37474f">capture → color-convert → encode lane moves zero frame bytes through system memory by construction — the KPIs above quantify what that saves.</text>

  <text x="45" y="524" font-size="10.5" fill="#898781">Benchmarks will be measured with the project test plan's methodology (Tier-2 gtests + browser-level KPIs) on multiple GPUs and published,</text>
  <text x="45" y="540" font-size="10.5" fill="#898781">reproducibly, alongside the upstream Chromium change lists. No performance figures are claimed here until then.</text>
</svg>
