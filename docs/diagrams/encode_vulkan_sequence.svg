<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="640" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">
    Vulkan Video Encode — Per-Frame Submission Sequence
  </text>
  <text x="640" y="50" text-anchor="middle" font-size="12" fill="#546e7a">
    H264VulkanVideoEncoderDelegate::PrepareEncodeJob() → vkCmdBeginVideoCodingKHR / vkCmdEncodeVideoKHR / vkCmdEndVideoCodingKHR
  </text>

  <!-- Lifelines -->
  <g font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">
    <rect x="20" y="70" width="200" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="120" y="93">VulkanVideoEncodeAccelerator</text>

    <rect x="240" y="70" width="200" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="340" y="93">H264VulkanVideoEncoder Delegate</text>

    <rect x="460" y="70" width="200" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="560" y="93">VulkanVideoEncoderWrapper</text>

    <rect x="680" y="70" width="180" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="770" y="93">Vulkan ICD</text>

    <rect x="880" y="70" width="170" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="965" y="93">Encode queue (VK_QUEUE_VIDEO_ENCODE_BIT_KHR)</text>

    <rect x="1070" y="70" width="190" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="1165" y="93">HW Encode Engine</text>
  </g>

  <!-- Lifelines -->
  <line x1="120" y1="106" x2="120" y2="800" stroke="#90a4ae" stroke-dasharray="4,4"/>
  <line x1="340" y1="106" x2="340" y2="800" stroke="#90a4ae" stroke-dasharray="4,4"/>
  <line x1="560" y1="106" x2="560" y2="800" stroke="#90a4ae" stroke-dasharray="4,4"/>
  <line x1="770" y1="106" x2="770" y2="800" stroke="#90a4ae" stroke-dasharray="4,4"/>
  <line x1="965" y1="106" x2="965" y2="800" stroke="#90a4ae" stroke-dasharray="4,4"/>
  <line x1="1165" y1="106" x2="1165" y2="800" stroke="#90a4ae" stroke-dasharray="4,4"/>

  <g font-size="11" fill="#37474f">
    <!-- 1 -->
    <line x1="120" y1="135" x2="340" y2="135" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="230" y="128" text-anchor="middle">1. Encode(frame, force_keyframe)</text>

    <!-- 2. PrepareEncodeJob -->
    <line x1="340" y1="160" x2="340" y2="220" stroke="#37474f" stroke-width="1.5"/>
    <rect x="335" y="157" width="10" height="70" fill="#a5d6a7" stroke="#2e7d32"/>
    <text x="355" y="185" text-anchor="start">2. PrepareEncodeJob — fill StdVideoH264*</text>
    <text x="355" y="200" text-anchor="start">    SPS / PPS / SliceHeader, pick QP</text>
    <text x="355" y="215" text-anchor="start">    select DPB slot, fill RefPicLists</text>

    <!-- 3. UpdateSessionParameters (only on IDR / first frame) -->
    <line x1="340" y1="245" x2="560" y2="245" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="450" y="238" text-anchor="middle" fill="#bf360c">3. (on SPS/PPS change) UpdateSessionParameters(std_sps, std_pps)</text>

    <line x1="560" y1="270" x2="770" y2="270" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="665" y="263" text-anchor="middle">3a. vkCreateVideoSessionParametersKHR</text>

    <!-- 4. ExecuteEncode -->
    <line x1="340" y1="305" x2="560" y2="305" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="298" text-anchor="middle" font-weight="bold">4. ExecuteEncode(EncodeJob*)</text>

    <!-- 5a. record cmd buf -->
    <line x1="560" y1="335" x2="560" y2="455" stroke="#37474f" stroke-width="1.5"/>
    <rect x="555" y="332" width="10" height="125" fill="#dcedc8" stroke="#558b2f"/>
    <text x="575" y="355" text-anchor="start">5. Record cmd buffer:</text>
    <text x="575" y="372" text-anchor="start">  vkCmdResetQueryPool(feedback, slot)</text>
    <text x="575" y="388" text-anchor="start">  TransitionImage(input → VIDEO_ENCODE_SRC)</text>
    <text x="575" y="404" text-anchor="start">  TransitionImage(recon → VIDEO_ENCODE_DPB)</text>
    <text x="575" y="420" text-anchor="start">  vkCmdBeginVideoCodingKHR(begin {session, refs, rate-control})</text>
    <text x="575" y="436" text-anchor="start">  vkCmdControlVideoCodingKHR(rc/quality/reset) — first frame only</text>
    <text x="575" y="452" text-anchor="start">  vkCmdEncodeVideoKHR(encode_info { dstBuffer, srcPic, refs, h264 pic info })</text>

    <line x1="560" y1="475" x2="560" y2="500" stroke="#37474f" stroke-width="1.5"/>
    <rect x="555" y="472" width="10" height="30" fill="#dcedc8" stroke="#558b2f"/>
    <text x="575" y="492" text-anchor="start">  vkCmdEndVideoCodingKHR</text>

    <!-- 6. submit -->
    <line x1="560" y1="525" x2="770" y2="525" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="665" y="518" text-anchor="middle" font-weight="bold">6. vkQueueSubmit2 (signal timeline_sem = N)</text>

    <line x1="770" y1="555" x2="965" y2="555" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="867" y="548" text-anchor="middle">6a. queue command buffer</text>

    <line x1="965" y1="585" x2="1165" y2="585" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1065" y="578" text-anchor="middle">6b. submit to HW engine</text>

    <!-- HW work -->
    <rect x="1160" y="605" width="10" height="80" fill="#ffe082" stroke="#f57c00"/>
    <text x="1220" y="650" text-anchor="middle" fill="#bf360c" font-style="italic">[hw encode]</text>

    <!-- 7. completion signal -->
    <line x1="1165" y1="695" x2="965" y2="695" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowBack)"/>
    <text x="1065" y="688" text-anchor="middle" fill="#2e7d32">7. HW IRQ → ICD updates timeline sem</text>

    <!-- 8. wait + readback -->
    <line x1="120" y1="725" x2="560" y2="725" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="340" y="718" text-anchor="middle" fill="#2e7d32">8. vkWaitSemaphores(timeline_sem, N) → vkGetQueryPoolResults (FEEDBACK)</text>

    <line x1="560" y1="755" x2="120" y2="755" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowBack)"/>
    <text x="340" y="748" text-anchor="middle" fill="#2e7d32">9. {bitstream_offset, size, status} + memcpy VkBuffer → shmem</text>

    <line x1="120" y1="785" x2="20" y2="785" stroke="#2e7d32" stroke-width="2"/>
    <line x1="120" y1="785" x2="120" y2="800" stroke="#2e7d32" stroke-width="2"/>
    <text x="180" y="780" text-anchor="start" fill="#2e7d32" font-weight="bold">10. Client::BitstreamBufferReady(id, metadata)</text>
  </g>

  <text x="20" y="815" font-size="10" fill="#78909c">
    All Vulkan Video calls use sync2 + timeline semaphores. Inline queries via VK_KHR_video_maintenance1 avoid begin/end query trips.
  </text>
</svg>
