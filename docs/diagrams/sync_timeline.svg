<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550">
  <defs>
    <linearGradient id="decodeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="renderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ADE80;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="displayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="550" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    Video Decode Synchronization Timeline
  </text>
  
  <!-- Timeline axis -->
  <line x1="100" y1="480" x2="1050" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1070" y="485" font-family="Arial, sans-serif" font-size="12" fill="#64748b">time</text>
  
  <!-- Queue Labels -->
  <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Video</text>
  <text x="50" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Decode</text>
  <text x="50" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">Queue</text>
  
  <text x="50" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Graphics</text>
  <text x="50" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Render</text>
  <text x="50" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">Queue</text>
  
  <text x="50" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309">Display</text>
  <text x="50" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309">Present</text>
  <text x="50" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">Queue</text>
  
  <!-- Queue lines -->
  <line x1="100" y1="110" x2="1050" y2="110" stroke="#dbeafe" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="235" x2="1050" y2="235" stroke="#dcfce7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="360" x2="1050" y2="360" stroke="#fef3c7" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Frame 1 -->
  <rect x="120" y="75" width="180" height="70" rx="6" fill="url(#decodeGrad)" filter="url(#shadow)"/>
  <text x="210" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">vkCmdDecodeVideoKHR</text>
  <text x="210" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">Frame 1</text>
  <text x="210" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">H.264 decode</text>
  
  <!-- Semaphore 1 -->
  <circle cx="310" cy="145" r="8" fill="#ef4444"/>
  <text x="310" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#fff">S1</text>
  <line x1="310" y1="153" x2="310" y2="195" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="310,200 305,193 315,193" fill="#ef4444"/>
  <text x="325" y="175" font-family="Arial, sans-serif" font-size="8" fill="#ef4444">signal</text>
  
  <!-- Render 1 -->
  <rect x="310" y="200" width="150" height="70" rx="6" fill="url(#renderGrad)" filter="url(#shadow)"/>
  <text x="385" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Composite/Scale</text>
  <text x="385" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">Frame 1</text>
  <text x="385" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dcfce7">wait S1</text>
  
  <!-- Semaphore 2 -->
  <circle cx="470" cy="270" r="8" fill="#ef4444"/>
  <text x="470" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#fff">S2</text>
  <line x1="470" y1="278" x2="470" y2="320" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="470,325 465,318 475,318" fill="#ef4444"/>
  
  <!-- Present 1 -->
  <rect x="470" y="325" width="120" height="70" rx="6" fill="url(#displayGrad)" filter="url(#shadow)"/>
  <text x="530" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Present</text>
  <text x="530" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">Frame 1</text>
  <text x="530" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fef3c7">wait S2</text>
  
  <!-- Frame 2 (overlapped) -->
  <rect x="320" y="75" width="180" height="70" rx="6" fill="url(#decodeGrad)" filter="url(#shadow)"/>
  <text x="410" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">vkCmdDecodeVideoKHR</text>
  <text x="410" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">Frame 2</text>
  <text x="410" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">H.264 decode</text>
  
  <!-- Semaphore 3 -->
  <circle cx="510" cy="145" r="8" fill="#ef4444"/>
  <text x="510" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#fff">S3</text>
  <line x1="510" y1="153" x2="510" y2="195" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="510,200 505,193 515,193" fill="#ef4444"/>
  
  <!-- Render 2 -->
  <rect x="510" y="200" width="150" height="70" rx="6" fill="url(#renderGrad)" filter="url(#shadow)"/>
  <text x="585" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Composite/Scale</text>
  <text x="585" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">Frame 2</text>
  
  <!-- Frame 3 -->
  <rect x="520" y="75" width="180" height="70" rx="6" fill="url(#decodeGrad)" filter="url(#shadow)"/>
  <text x="610" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">vkCmdDecodeVideoKHR</text>
  <text x="610" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">Frame 3</text>
  
  <!-- Present 2 -->
  <rect x="660" y="325" width="120" height="70" rx="6" fill="url(#displayGrad)" filter="url(#shadow)"/>
  <text x="720" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Present</text>
  <text x="720" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">Frame 2</text>
  
  <!-- Render 3 -->
  <rect x="710" y="200" width="150" height="70" rx="6" fill="url(#renderGrad)" filter="url(#shadow)"/>
  <text x="785" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Composite/Scale</text>
  <text x="785" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">Frame 3</text>
  
  <!-- Frame 4 -->
  <rect x="720" y="75" width="180" height="70" rx="6" fill="url(#decodeGrad)" filter="url(#shadow)"/>
  <text x="810" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">vkCmdDecodeVideoKHR</text>
  <text x="810" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">Frame 4</text>
  
  <!-- Present 3 -->
  <rect x="850" y="325" width="120" height="70" rx="6" fill="url(#displayGrad)" filter="url(#shadow)"/>
  <text x="910" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Present</text>
  <text x="910" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">Frame 3</text>
  
  <!-- VSync markers -->
  <line x1="590" y1="395" x2="590" y2="455" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="590" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">VSync</text>
  
  <line x1="780" y1="395" x2="780" y2="455" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="780" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">VSync</text>
  
  <line x1="970" y1="395" x2="970" y2="455" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="970" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">VSync</text>
  
  <!-- Legend -->
  <rect x="100" y="500" width="900" height="45" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="520" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Synchronization:</text>
  
  <circle cx="230" cy="522" r="8" fill="#ef4444"/>
  <text x="230" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#fff">S</text>
  <text x="250" y="527" font-family="Arial, sans-serif" font-size="10" fill="#64748b">= Vulkan Semaphore (GPU-GPU sync)</text>
  
  <line x1="450" y1="522" x2="480" y2="522" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="490" y="527" font-family="Arial, sans-serif" font-size="10" fill="#64748b">= VSync (Display refresh)</text>
  
  <text x="680" y="527" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Decode overlaps Render = Pipeline parallelism</text>
</svg>

