<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 950 600">
  <defs>
    <linearGradient id="interfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vaapiGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="v4l2Grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vulkanGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="parserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="delegateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="950" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="475" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Class Hierarchy - Decoder Architecture</text>
  <text x="475" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Shared codec parsers with platform-specific delegates</text>
  
  <!-- VideoDecoderMixin (interface at top) -->
  <rect x="350" y="70" width="250" height="60" rx="8" fill="url(#interfaceGrad)"/>
  <text x="475" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">VideoDecoderMixin</text>
  <text x="475" y="115" text-anchor="middle" font-family="monospace" font-size="9" fill="#dbeafe">media/gpu/chromeos/video_decoder_pipeline.h</text>
  
  <!-- "implements" label -->
  <text x="475" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">implements</text>
  
  <!-- Connector lines from interface to implementations -->
  <line x1="475" y1="130" x2="475" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="160" x2="800" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="160" x2="150" y2="185" stroke="#64748b" stroke-width="2"/>
  <line x1="475" y1="160" x2="475" y2="185" stroke="#64748b" stroke-width="2"/>
  <line x1="800" y1="160" x2="800" y2="185" stroke="#64748b" stroke-width="2"/>
  <!-- Hollow triangle arrows (inheritance) -->
  <polygon points="150,190 143,178 157,178" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="475,190 468,178 482,178" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="800,190 793,178 807,178" fill="none" stroke="#64748b" stroke-width="1.5"/>
  
  <!-- Three decoder implementations -->
  <rect x="50" y="195" width="200" height="55" rx="8" fill="url(#vaapiGrad2)"/>
  <text x="150" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">VaapiVideoDecoder</text>
  <text x="150" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fecaca">VA-API backend</text>
  
  <rect x="375" y="195" width="200" height="55" rx="8" fill="url(#v4l2Grad2)"/>
  <text x="475" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">V4L2VideoDecoder</text>
  <text x="475" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">V4L2 backend</text>
  
  <rect x="700" y="195" width="200" height="55" rx="8" fill="url(#vulkanGrad2)"/>
  <rect x="830" y="200" width="60" height="18" rx="4" fill="#22c55e"/>
  <text x="860" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">NEW</text>
  <text x="800" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">VulkanVideoDecoder</text>
  <text x="800" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ede9fe">Vulkan backend</text>
  
  <!-- "creates" arrows (dashed lines with filled arrows) -->
  <line x1="150" y1="250" x2="150" y2="290" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="150,295 145,283 155,283" fill="#64748b"/>
  <text x="175" y="275" font-family="Arial, sans-serif" font-size="9" fill="#64748b">creates</text>
  
  <line x1="800" y1="250" x2="800" y2="290" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="800,295 795,283 805,283" fill="#64748b"/>
  <text x="825" y="275" font-family="Arial, sans-serif" font-size="9" fill="#64748b">creates</text>
  
  <!-- AcceleratedVideoDecoder boxes (shared) -->
  <rect x="50" y="300" width="200" height="70" rx="8" fill="url(#parserGrad)"/>
  <text x="150" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">AcceleratedVideoDecoder</text>
  <text x="150" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">(H264/VP9/AV1...)</text>
  <text x="150" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dcfce7">Codec parsing logic</text>
  
  <rect x="700" y="300" width="200" height="70" rx="8" fill="url(#parserGrad)"/>
  <text x="800" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">AcceleratedVideoDecoder</text>
  <text x="800" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">(same classes!)</text>
  <text x="800" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dcfce7">Codec parsing logic</text>
  
  <!-- "shared" arrow between them -->
  <line x1="250" y1="335" x2="700" y2="335" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="420" y="320" width="110" height="25" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="475" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">SHARED</text>
  
  <!-- "uses" arrows -->
  <line x1="150" y1="370" x2="150" y2="410" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="150,415 145,403 155,403" fill="#64748b"/>
  <text x="175" y="395" font-family="Arial, sans-serif" font-size="9" fill="#64748b">uses</text>
  
  <line x1="800" y1="370" x2="800" y2="410" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="800,415 795,403 805,403" fill="#64748b"/>
  <text x="825" y="395" font-family="Arial, sans-serif" font-size="9" fill="#64748b">uses</text>
  
  <!-- Delegate boxes -->
  <rect x="50" y="420" width="200" height="70" rx="8" fill="url(#delegateGrad)"/>
  <text x="150" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">H264VaapiVideoDecoder</text>
  <text x="150" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Delegate</text>
  <text x="150" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fce7f3">VA-API specific calls</text>

  <rect x="700" y="420" width="200" height="70" rx="8" fill="url(#delegateGrad)"/>
  <rect x="830" y="425" width="60" height="18" rx="4" fill="#22c55e"/>
  <text x="860" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">NEW</text>
  <text x="800" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">H264VulkanVideoDecoder</text>
  <text x="800" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Delegate</text>
  <text x="800" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fce7f3">Vulkan Video specific calls</text>
  
  <!-- Key insight box -->
  <rect x="300" y="420" width="350" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="475" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">Key Insight</text>
  <text x="475" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#15803d">Codec parsers (H264Decoder, VP9Decoder, etc.)</text>
  <text x="475" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#15803d">are SHARED - only Delegates are platform-specific!</text>
  
  <!-- Legend -->
  <rect x="50" y="510" width="850" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Architecture:</text>
  <rect x="165" y="523" width="16" height="16" rx="3" fill="url(#interfaceGrad)"/>
  <text x="190" y="535" font-family="Arial, sans-serif" font-size="10" fill="#475569">Interface</text>
  <rect x="265" y="523" width="16" height="16" rx="3" fill="url(#parserGrad)"/>
  <text x="290" y="535" font-family="Arial, sans-serif" font-size="10" fill="#475569">Shared Parser</text>
  <rect x="395" y="523" width="16" height="16" rx="3" fill="url(#delegateGrad)"/>
  <text x="420" y="535" font-family="Arial, sans-serif" font-size="10" fill="#475569">Platform Delegate</text>
  
  <text x="70" y="560" font-family="Arial, sans-serif" font-size="10" fill="#64748b">For Vulkan integration: Implement VulkanVideoDecoder + codec-specific delegates (H264VulkanVideoDecoderDelegate, etc.)</text>
  <text x="70" y="575" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Reuse: All AcceleratedVideoDecoder classes (H264Decoder, VP9Decoder, AV1Decoder, HEVCDecoder)</text>
</svg>
