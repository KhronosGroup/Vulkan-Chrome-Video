<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600">
  <defs>
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pixmapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    FrameResource and VideoFrame Creation Flow
  </text>
  
  <!-- VA-API Column -->
  <rect x="40" y="60" width="320" height="520" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">VA-API Path</text>
  
  <!-- VASurfaceID -->
  <rect x="60" y="110" width="280" height="80" rx="6" fill="url(#surfaceGrad)" filter="url(#shadow)"/>
  <text x="200" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">VASurfaceID</text>
  <text x="200" y="160" text-anchor="middle" font-family="monospace" font-size="10" fill="#dbeafe">vaCreateSurfaces()</text>
  <text x="200" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">Driver-managed decode target</text>
  
  <!-- Export -->
  <rect x="60" y="210" width="280" height="80" rx="6" fill="url(#fdGrad)" filter="url(#shadow)"/>
  <text x="200" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">vaExportSurfaceHandle()</text>
  <text x="200" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#fef3c7">VA_SURFACE_ATTRIB_MEM_TYPE_DRM_PRIME_2</text>
  <text x="200" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">Returns VADRMPRIMESurfaceDescriptor</text>
  
  <!-- FD Info VA-API -->
  <rect x="60" y="310" width="280" height="100" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309">DMA-BUF FD Details</text>
  <text x="80" y="358" font-family="monospace" font-size="9" fill="#64748b">descriptor.objects[].fd</text>
  <text x="80" y="375" font-family="monospace" font-size="9" fill="#64748b">descriptor.layers[].pitch[]</text>
  <text x="80" y="392" font-family="monospace" font-size="9" fill="#64748b">descriptor.layers[].offset[]</text>
  <text x="80" y="409" font-family="monospace" font-size="9" fill="#64748b">descriptor.objects[].drm_format_modifier</text>
  
  <!-- Vulkan Column -->
  <rect x="390" y="60" width="320" height="520" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="550" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6">Vulkan Video Path</text>
  
  <!-- VkImage -->
  <rect x="410" y="110" width="280" height="80" rx="6" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="550" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">VkImage + VkDeviceMemory</text>
  <text x="550" y="160" text-anchor="middle" font-family="monospace" font-size="10" fill="#ede9fe">VK_KHR_video_decode_queue</text>
  <text x="550" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ede9fe">Decode target image</text>
  
  <!-- Vulkan Export -->
  <rect x="410" y="210" width="280" height="80" rx="6" fill="url(#fdGrad)" filter="url(#shadow)"/>
  <text x="550" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">vkGetMemoryFdKHR()</text>
  <text x="550" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#fef3c7">VK_EXT_external_memory_dma_buf</text>
  <text x="550" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">Export memory as DMA-BUF FD</text>
  
  <!-- FD Info Vulkan -->
  <rect x="410" y="310" width="280" height="100" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309">DMA-BUF FD Details</text>
  <text x="430" y="358" font-family="monospace" font-size="9" fill="#64748b">dmabuf_fd (from vkGetMemoryFdKHR)</text>
  <text x="430" y="375" font-family="monospace" font-size="9" fill="#64748b">layout.rowPitch (vkGetImageSubresourceLayout)</text>
  <text x="430" y="392" font-family="monospace" font-size="9" fill="#64748b">layout.offset</text>
  <text x="430" y="409" font-family="monospace" font-size="9" fill="#64748b">DRM modifier (if tiled)</text>
  
  <!-- Common Output Column -->
  <rect x="740" y="60" width="320" height="520" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="900" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">Common Output</text>
  
  <!-- NativePixmapDmaBuf -->
  <rect x="760" y="110" width="280" height="100" rx="6" fill="url(#pixmapGrad)" filter="url(#shadow)"/>
  <text x="900" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">gfx::NativePixmapDmaBuf</text>
  <text x="900" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#fce7f3">ui/gfx/linux/native_pixmap_dmabuf.h</text>
  <text x="780" y="190" font-family="Arial, sans-serif" font-size="10" fill="#fce7f3">• Owns DMA-BUF FDs (ScopedFD)</text>
  <text x="780" y="205" font-family="Arial, sans-serif" font-size="10" fill="#fce7f3">• Per-plane stride/offset/size</text>
  
  <!-- NativePixmapFrameResource -->
  <rect x="760" y="230" width="280" height="100" rx="6" fill="url(#frameGrad)" filter="url(#shadow)"/>
  <text x="900" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">NativePixmapFrameResource</text>
  <text x="900" y="285" text-anchor="middle" font-family="monospace" font-size="10" fill="#dcfce7">media/gpu/chromeos/</text>
  <text x="780" y="310" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">• Implements FrameResource</text>
  <text x="780" y="325" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">• GetDmabufFd(plane), layout()</text>
  
  <!-- VideoFrame -->
  <rect x="760" y="350" width="280" height="120" rx="6" fill="url(#frameGrad)" filter="url(#shadow)"/>
  <text x="900" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">media::VideoFrame</text>
  <text x="900" y="405" text-anchor="middle" font-family="monospace" font-size="10" fill="#dcfce7">STORAGE_DMABUFS or</text>
  <text x="900" y="420" text-anchor="middle" font-family="monospace" font-size="10" fill="#dcfce7">STORAGE_OPAQUE (SharedImage)</text>
  <text x="780" y="445" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">• timestamp, visible_rect</text>
  <text x="780" y="460" font-family="Arial, sans-serif" font-size="10" fill="#dcfce7">• color_space, hdr_metadata</text>
  
  <!-- Callback -->
  <rect x="760" y="490" width="280" height="70" rx="6" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="900" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Output Callback</text>
  <text x="900" y="540" text-anchor="middle" font-family="monospace" font-size="10" fill="#15803d">VideoDecoderPipeline::OnFrameConverted()</text>
  
  <!-- Arrows -->
  <!-- VA-API vertical -->
  <line x1="200" y1="190" x2="200" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="290" x2="200" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Vulkan vertical -->
  <line x1="550" y1="190" x2="550" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="290" x2="550" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- VA-API to common -->
  <line x1="340" y1="360" x2="740" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Vulkan to common -->
  <line x1="690" y1="360" x2="760" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Common vertical -->
  <line x1="900" y1="210" x2="900" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="330" x2="900" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="470" x2="900" y2="490" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Key insight -->
  <rect x="40" y="585" width="1020" height="12" rx="4" fill="#f59e0b"/>
  <text x="550" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">
    KEY: Both VA-API and Vulkan export to same gfx::NativePixmapDmaBuf → Rest of pipeline is identical!
  </text>
</svg>

