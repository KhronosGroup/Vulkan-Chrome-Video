<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850">
  <defs>
    <linearGradient id="parserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="decoderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vulkanAccelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="850" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">
    Shared Codec Parser Architecture
  </text>
  <text x="550" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">
    Codec parsing is shared across all hardware backends
  </text>
  
  <!-- Bitstream Parsers Section -->
  <rect x="40" y="80" width="1020" height="140" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">
    Bitstream Parsers (media/parsers/) - SHARED
  </text>
  
  <!-- Parser boxes -->
  <rect x="60" y="120" width="130" height="80" rx="6" fill="url(#parserGrad)" filter="url(#shadow)"/>
  <text x="125" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">H264Parser</text>
  <text x="125" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">h264_parser.h</text>
  <text x="125" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">NAL, SPS, PPS, Slice</text>
  
  <rect x="210" y="120" width="130" height="80" rx="6" fill="url(#parserGrad)" filter="url(#shadow)"/>
  <text x="275" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">H265Parser</text>
  <text x="275" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">h265_parser.h</text>
  <text x="275" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">VPS, SPS, PPS</text>
  
  <rect x="360" y="120" width="130" height="80" rx="6" fill="url(#parserGrad)" filter="url(#shadow)"/>
  <text x="425" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">VP9Parser</text>
  <text x="425" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">vp9_parser.h</text>
  <text x="425" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">Frame Headers</text>
  
  <rect x="510" y="120" width="130" height="80" rx="6" fill="url(#parserGrad)" filter="url(#shadow)"/>
  <text x="575" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">VP8Parser</text>
  <text x="575" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">vp8_parser.h</text>
  <text x="575" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">Frame Headers</text>
  
  <rect x="660" y="120" width="130" height="80" rx="6" fill="url(#parserGrad)" filter="url(#shadow)"/>
  <text x="725" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">AV1 Parser</text>
  <text x="725" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">libgav1 / dav1d</text>
  <text x="725" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">OBU Parsing</text>
  
  <rect x="810" y="120" width="130" height="80" rx="6" fill="url(#parserGrad)" filter="url(#shadow)"/>
  <text x="875" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">H266Parser</text>
  <text x="875" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">h266_parser.h</text>
  <text x="875" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">VVC NAL Units</text>
  
  <!-- AcceleratedVideoDecoder Section -->
  <rect x="40" y="240" width="1020" height="160" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46">
