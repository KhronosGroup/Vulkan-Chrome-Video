  <text x="550" y="842" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">
    KEY BENEFIT: Same parser code, same DPB logic, different HW commands → Vulkan integration only needs new Delegate classes!
  </text>
</svg>

