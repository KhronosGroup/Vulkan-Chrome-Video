  <text x="480" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">H264VulkanDelegate</text>
  <text x="480" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ede9fe">VkVideoDecodeH264*</text>
  
  <rect x="560" y="620" width="140" height="50" rx="4" fill="url(#vulkanAccelGrad)" filter="url(#shadow)"/>
  <text x="630" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">H265VulkanDelegate</text>
  <text x="630" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ede9fe">VkVideoDecodeH265*</text>
  
  <rect x="410" y="680" width="140" height="50" rx="4" fill="url(#vulkanAccelGrad)" filter="url(#shadow)"/>
  <text x="480" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">VP9VulkanDelegate</text>
  <text x="480" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ede9fe">Future Extension</text>
  
  <rect x="560" y="680" width="140" height="50" rx="4" fill="url(#vulkanAccelGrad)" filter="url(#shadow)"/>
  <text x="630" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">AV1VulkanDelegate</text>
  <text x="630" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ede9fe">VkVideoDecodeAV1*</text>
  
  <rect x="410" y="740" width="290" height="60" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="555" y="762" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">VulkanWrapper</text>
  <text x="555" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6d28d9">vkCmdBeginVideoCoding → vkCmdDecodeVideo → vkCmdEndVideoCoding</text>
  
  <!-- V4L2 Accelerators -->
  <rect x="740" y="580" width="310" height="240" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="760" y="605" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9d174d">V4L2 (media/gpu/v4l2/)</text>
  
  <rect x="760" y="620" width="130" height="50" rx="4" fill="#db2777" filter="url(#shadow)"/>
  <text x="825" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">H264V4L2Delegate</text>
  <text x="825" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fce7f3">v4l2_ctrl_h264_*</text>
  
  <rect x="900" y="620" width="130" height="50" rx="4" fill="#db2777" filter="url(#shadow)"/>
  <text x="965" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">H265V4L2Delegate</text>
  <text x="965" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fce7f3">v4l2_ctrl_hevc_*</text>
  
  <rect x="760" y="680" width="130" height="50" rx="4" fill="#db2777" filter="url(#shadow)"/>
  <text x="825" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">VP9V4L2Delegate</text>
  <text x="825" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fce7f3">v4l2_ctrl_vp9_*</text>
  
  <rect x="900" y="680" width="130" height="50" rx="4" fill="#db2777" filter="url(#shadow)"/>
  <text x="965" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">AV1V4L2Delegate</text>
  <text x="965" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fce7f3">v4l2_ctrl_av1_*</text>
  
  <rect x="760" y="740" width="270" height="60" rx="4" fill="#fff" stroke="#db2777" stroke-width="1"/>
  <text x="895" y="762" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9d174d">V4L2StatelessDevice</text>
  <text x="895" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#be185d">VIDIOC_QBUF → VIDIOC_STREAMON</text>
  
  <!-- Arrows from parsers to decoders -->
  <line x1="125" y1="200" x2="150" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="275" y1="200" x2="350" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="425" y1="200" x2="550" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="725" y1="200" x2="750" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Key Benefits Box -->
