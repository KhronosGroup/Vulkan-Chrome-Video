  </text>
  
  <!-- Decoder boxes -->
  <rect x="60" y="285" width="180" height="95" rx="6" fill="url(#decoderGrad)" filter="url(#shadow)"/>
  <text x="150" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">H264Decoder</text>
  <text x="150" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">h264_decoder.h</text>
  <text x="150" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• DPB Management</text>
  <text x="150" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• Reference Lists</text>
  
  <rect x="260" y="285" width="180" height="95" rx="6" fill="url(#decoderGrad)" filter="url(#shadow)"/>
  <text x="350" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">H265Decoder</text>
  <text x="350" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">h265_decoder.h</text>
  <text x="350" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• DPB Management</text>
  <text x="350" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• Reference Lists</text>
  
  <rect x="460" y="285" width="180" height="95" rx="6" fill="url(#decoderGrad)" filter="url(#shadow)"/>
  <text x="550" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">VP9Decoder</text>
  <text x="550" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">vp9_decoder.h</text>
  <text x="550" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• Reference Frames</text>
  <text x="550" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• Segmentation</text>
  
  <rect x="660" y="285" width="180" height="95" rx="6" fill="url(#decoderGrad)" filter="url(#shadow)"/>
  <text x="750" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">AV1Decoder</text>
  <text x="750" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">av1_decoder.h</text>
  <text x="750" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• Reference Frames</text>
  <text x="750" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• Film Grain</text>
  
  <rect x="860" y="285" width="180" height="95" rx="6" fill="url(#decoderGrad)" filter="url(#shadow)"/>
  <text x="950" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">VP8Decoder</text>
  <text x="950" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">vp8_decoder.h</text>
  <text x="950" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• Golden Frame</text>
  <text x="950" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5">• AltRef Frame</text>
  
  <!-- Accelerator Interface Label -->
  <text x="550" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748b">
    ↓ Accelerator Interface (Pure Virtual) ↓
  </text>
  
  <!-- Accelerator Interface Box -->
  <rect x="200" y="445" width="700" height="90" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="550" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">
    class H264Accelerator {
  </text>
  <text x="550" y="493" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">
    virtual Status SubmitFrameMetadata(SPS, PPS, DPB, ref_lists, pic) = 0;
  </text>
  <text x="550" y="508" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">
    virtual Status SubmitSlice(PPS, slice_hdr, ref_lists, data, size) = 0;
  </text>
  <text x="550" y="523" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">
    virtual Status SubmitDecode(pic) = 0;  };
  </text>
  
  <!-- Hardware Accelerator Implementations -->
  <text x="550" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748b">
    Hardware-Specific Accelerator Implementations
  </text>
  
  <!-- VA-API Accelerators -->
  <rect x="40" y="580" width="330" height="240" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="605" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">VA-API (media/gpu/vaapi/)</text>
  
  <rect x="60" y="620" width="140" height="50" rx="4" fill="url(#accelGrad)" filter="url(#shadow)"/>
  <text x="130" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">H264VaapiDelegate</text>
  <text x="130" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fef3c7">VAPictureParameterBuffer</text>
  
  <rect x="210" y="620" width="140" height="50" rx="4" fill="url(#accelGrad)" filter="url(#shadow)"/>
  <text x="280" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">H265VaapiDelegate</text>
  <text x="280" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fef3c7">VADecPictureParams</text>
  
  <rect x="60" y="680" width="140" height="50" rx="4" fill="url(#accelGrad)" filter="url(#shadow)"/>
  <text x="130" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">VP9VaapiDelegate</text>
  <text x="130" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fef3c7">VADecPictureParamsVP9</text>
  
  <rect x="210" y="680" width="140" height="50" rx="4" fill="url(#accelGrad)" filter="url(#shadow)"/>
  <text x="280" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">AV1VaapiDelegate</text>
  <text x="280" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fef3c7">VADecPictureParamsAV1</text>
  
  <rect x="60" y="740" width="290" height="60" rx="4" fill="#fff" stroke="#d97706" stroke-width="1"/>
  <text x="205" y="762" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e">VaapiWrapper</text>
  <text x="205" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b45309">vaBeginPicture → vaRenderPicture → vaEndPicture</text>
  
  <!-- Vulkan Video Accelerators (NEW) -->
  <rect x="390" y="580" width="330" height="240" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
  <text x="410" y="605" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">
    ★ Vulkan Video (media/gpu/vulkan/) NEW
  </text>
  
