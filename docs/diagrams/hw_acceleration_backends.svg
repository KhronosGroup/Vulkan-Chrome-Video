<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vaapiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="v4l2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vulkanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wrapperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Hardware Acceleration Backends</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Chromium Video Decoder Architecture</text>
  
  <!-- VideoDecoderPipeline (top) -->
  <rect x="150" y="75" width="600" height="60" rx="8" fill="url(#pipelineGrad)"/>
  <text x="450" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">VideoDecoderPipeline</text>
  <text x="450" y="120" text-anchor="middle" font-family="monospace" font-size="10" fill="#dbeafe">media/gpu/chromeos/video_decoder_pipeline.h</text>
  
  <!-- Connector lines from Pipeline to decoders -->
  <!-- Vertical line down from pipeline -->
  <line x1="450" y1="135" x2="450" y2="175" stroke="#64748b" stroke-width="2"/>
  <!-- Horizontal branch line -->
  <line x1="150" y1="175" x2="750" y2="175" stroke="#64748b" stroke-width="2"/>
  <!-- Vertical lines down to each decoder -->
  <line x1="150" y1="175" x2="150" y2="205" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="175" x2="450" y2="205" stroke="#64748b" stroke-width="2"/>
  <line x1="750" y1="175" x2="750" y2="205" stroke="#64748b" stroke-width="2"/>
  <!-- Arrow heads (simple triangles) -->
  <polygon points="150,205 145,195 155,195" fill="#64748b"/>
  <polygon points="450,205 445,195 455,195" fill="#64748b"/>
  <polygon points="750,205 745,195 755,195" fill="#64748b"/>
  
  <!-- Decoder boxes (middle row) -->
  <!-- VA-API Decoder -->
  <rect x="50" y="210" width="200" height="80" rx="8" fill="url(#vaapiGrad)"/>
  <text x="150" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">VaapiVideoDecoder</text>
  <text x="150" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fecaca">(Linux / ChromeOS)</text>
  <text x="150" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fecaca">Intel, AMD GPUs</text>
  
  <!-- V4L2 Decoder -->
  <rect x="350" y="210" width="200" height="80" rx="8" fill="url(#v4l2Grad)"/>
  <text x="450" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">V4L2VideoDecoder</text>
  <text x="450" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7">(ARM / ChromeOS)</text>
  <text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">MediaTek, Qualcomm</text>
  
  <!-- Vulkan Decoder -->
  <rect x="650" y="210" width="200" height="80" rx="8" fill="url(#vulkanGrad)"/>
  <rect x="780" y="215" width="60" height="20" rx="4" fill="#22c55e"/>
  <text x="810" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">NEW</text>
  <text x="750" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">VulkanVideoDecoder</text>
  <text x="750" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ede9fe">(Cross-platform)</text>
  <text x="750" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ede9fe">All Vulkan GPUs</text>
  
  <!-- Connector lines from decoders to wrappers -->
  <line x1="150" y1="290" x2="150" y2="335" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="290" x2="450" y2="335" stroke="#64748b" stroke-width="2"/>
  <line x1="750" y1="290" x2="750" y2="335" stroke="#64748b" stroke-width="2"/>
  <!-- Arrow heads -->
  <polygon points="150,335 145,325 155,325" fill="#64748b"/>
  <polygon points="450,335 445,325 455,325" fill="#64748b"/>
  <polygon points="750,335 745,325 755,325" fill="#64748b"/>
  
  <!-- Wrapper boxes (bottom row) -->
  <!-- VA-API Wrapper -->
  <rect x="50" y="340" width="200" height="70" rx="8" fill="url(#wrapperGrad)"/>
  <text x="150" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">VaapiWrapper</text>
  <text x="150" y="390" text-anchor="middle" font-family="monospace" font-size="10" fill="#dcfce7">libva</text>
  
  <!-- V4L2 Device -->
  <rect x="350" y="340" width="200" height="70" rx="8" fill="url(#wrapperGrad)"/>
  <text x="450" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">V4L2Device</text>
  <text x="450" y="390" text-anchor="middle" font-family="monospace" font-size="10" fill="#dcfce7">Linux kernel</text>
  
  <!-- Vulkan Wrapper -->
  <rect x="650" y="340" width="200" height="70" rx="8" fill="url(#wrapperGrad)"/>
  <rect x="780" y="345" width="60" height="20" rx="4" fill="#22c55e"/>
  <text x="810" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">NEW</text>
  <text x="750" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">VulkanWrapper</text>
  <text x="750" y="390" text-anchor="middle" font-family="monospace" font-size="10" fill="#dcfce7">libvulkan</text>
  
  <!-- Legend -->
  <rect x="50" y="430" width="800" height="55" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="455" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Legend:</text>
  <rect x="140" y="445" width="16" height="16" rx="3" fill="url(#vaapiGrad)"/>
  <text x="165" y="457" font-family="Arial, sans-serif" font-size="10" fill="#475569">VA-API (Linux desktop)</text>
  <rect x="300" y="445" width="16" height="16" rx="3" fill="url(#v4l2Grad)"/>
  <text x="325" y="457" font-family="Arial, sans-serif" font-size="10" fill="#475569">V4L2 (ARM devices)</text>
  <rect x="450" y="445" width="16" height="16" rx="3" fill="url(#vulkanGrad)"/>
  <text x="475" y="457" font-family="Arial, sans-serif" font-size="10" fill="#475569">Vulkan (new, cross-platform)</text>
  <rect x="640" y="445" width="16" height="16" rx="3" fill="url(#wrapperGrad)"/>
  <text x="665" y="457" font-family="Arial, sans-serif" font-size="10" fill="#475569">Low-level driver interface</text>
</svg>
