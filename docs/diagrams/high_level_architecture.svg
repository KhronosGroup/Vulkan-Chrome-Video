<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="browserGradHL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gpuGradHL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vizGradHL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="driverGradHL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="550" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">High-Level Architecture</text>
  
  <!-- Browser Process Section -->
  <rect x="40" y="50" width="820" height="100" rx="10" fill="url(#browserGradHL)" opacity="0.15"/>
  <rect x="40" y="50" width="820" height="100" rx="10" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">BROWSER PROCESS</text>
  
  <!-- Browser Process boxes -->
  <rect x="60" y="85" width="140" height="50" rx="6" fill="#fff" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Blink/WebKit</text>
  <text x="130" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6">Renderer</text>
  
  <rect x="230" y="85" width="140" height="50" rx="6" fill="#fff" stroke="#3B82F6" stroke-width="2"/>
  <text x="300" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">cc (Compositor</text>
  <text x="300" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6">Client)</text>
  
  <rect x="400" y="85" width="160" height="50" rx="6" fill="#fff" stroke="#3B82F6" stroke-width="2"/>
  <text x="480" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Frame Submission</text>
  <text x="480" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6">(CompositorFrame)</text>
  
  <!-- Arrows in browser process -->
  <line x1="200" y1="110" x2="225" y2="110" stroke="#3B82F6" stroke-width="2"/>
  <polygon points="230,110 220,105 220,115" fill="#3B82F6"/>
  <line x1="370" y1="110" x2="395" y2="110" stroke="#3B82F6" stroke-width="2"/>
  <polygon points="400,110 390,105 390,115" fill="#3B82F6"/>
  
  <!-- Mojo IPC -->
  <rect x="200" y="165" width="500" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="450" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Mojo IPC Boundary</text>
  
  <!-- Arrow from browser to GPU -->
  <line x1="450" y1="150" x2="450" y2="160" stroke="#64748b" stroke-width="2"/>
  <polygon points="450,165 445,155 455,155" fill="#64748b"/>
  
  <!-- GPU Process Section -->
  <rect x="40" y="210" width="820" height="180" rx="10" fill="url(#gpuGradHL)" opacity="0.15"/>
  <rect x="40" y="210" width="820" height="180" rx="10" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="60" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">GPU PROCESS</text>
  
  <!-- Viz Section inside GPU -->
  <rect x="60" y="245" width="780" height="90" rx="8" fill="url(#vizGradHL)" opacity="0.2"/>
  <rect x="60" y="245" width="780" height="90" rx="8" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <text x="80" y="265" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#047857">Viz (Display Compositor)</text>
  
  <!-- Viz boxes -->
  <rect x="80" y="280" width="130" height="45" rx="5" fill="#fff" stroke="#10B981" stroke-width="1.5"/>
  <text x="145" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">Surface</text>
  <text x="145" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">Aggregator</text>
  
  <rect x="240" y="280" width="130" height="45" rx="5" fill="#fff" stroke="#10B981" stroke-width="1.5"/>
  <text x="305" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">Display</text>
  <text x="305" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#10B981">(Damage)</text>
  
  <rect x="400" y="280" width="160" height="45" rx="5" fill="#fff" stroke="#10B981" stroke-width="1.5"/>
  <text x="480" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">SkiaRenderer</text>
  <text x="480" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#10B981">(SkiaOutputSurface)</text>
  
  <!-- Arrows in Viz -->
  <line x1="210" y1="302" x2="235" y2="302" stroke="#10B981" stroke-width="1.5"/>
  <polygon points="240,302 230,297 230,307" fill="#10B981"/>
  <line x1="370" y1="302" x2="395" y2="302" stroke="#10B981" stroke-width="1.5"/>
  <polygon points="400,302 390,297 390,307" fill="#10B981"/>
  
  <!-- Skia backends -->
  <rect x="620" y="255" width="100" height="35" rx="5" fill="#fff" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="670" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">Ganesh</text>
  <text x="670" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B5CF6">(GL)</text>
  
  <rect x="620" y="295" width="100" height="35" rx="5" fill="#fff" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="670" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">Ganesh</text>
  <text x="670" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B5CF6">(Vulkan)</text>
  
  <rect x="740" y="275" width="100" height="35" rx="5" fill="#fff" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="790" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">Graphite</text>
  <text x="790" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B5CF6">(Dawn)</text>
  
  <!-- Arrow from Viz to backends -->
  <line x1="560" y1="302" x2="595" y2="302" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="595" y1="272" x2="595" y2="312" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="595" y1="272" x2="615" y2="272" stroke="#8B5CF6" stroke-width="1.5"/>
  <polygon points="620,272 610,267 610,277" fill="#8B5CF6"/>
  <line x1="595" y1="312" x2="615" y2="312" stroke="#8B5CF6" stroke-width="1.5"/>
  <polygon points="620,312 610,307 610,317" fill="#8B5CF6"/>
  <line x1="595" y1="292" x2="735" y2="292" stroke="#8B5CF6" stroke-width="1.5"/>
  <polygon points="740,292 730,287 730,297" fill="#8B5CF6"/>
  
  <!-- Arrow from GPU to Drivers -->
  <line x1="450" y1="390" x2="450" y2="410" stroke="#64748b" stroke-width="2"/>
  <polygon points="450,415 445,405 455,405" fill="#64748b"/>
  
  <!-- Graphics Drivers Section -->
  <rect x="40" y="420" width="820" height="60" rx="10" fill="url(#driverGradHL)" opacity="0.15"/>
  <rect x="40" y="420" width="820" height="60" rx="10" fill="none" stroke="#F97316" stroke-width="2"/>
  <text x="60" y="442" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">GRAPHICS DRIVERS</text>
  
  <!-- Driver boxes -->
  <rect x="60" y="450" width="120" height="25" rx="4" fill="#fff" stroke="#F97316" stroke-width="1.5"/>
  <text x="120" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">OpenGL/GLES</text>
  
  <rect x="200" y="450" width="100" height="25" rx="4" fill="#fff" stroke="#F97316" stroke-width="1.5"/>
  <text x="250" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">Vulkan</text>
  
  <rect x="320" y="450" width="120" height="25" rx="4" fill="#fff" stroke="#F97316" stroke-width="1.5"/>
  <text x="380" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">D3D11/D3D12</text>
  
  <rect x="460" y="450" width="100" height="25" rx="4" fill="#fff" stroke="#F97316" stroke-width="1.5"/>
  <text x="510" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">Metal</text>
  
  <!-- Legend -->
  <rect x="600" y="438" width="250" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="615" y="455" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">Process Flow:</text>
  <text x="615" y="468" font-family="Arial, sans-serif" font-size="8" fill="#64748b">Renderer → Compositor → GPU → Display</text>
  
  <!-- Arrow from Browser to Mojo IPC label -->
  <text x="470" y="158" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Mojo IPC</text>
  
  <!-- Version -->
  <text x="850" y="540" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Chromium Presentation Layer</text>
</svg>

