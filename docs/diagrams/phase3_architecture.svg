<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="browserGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c757d;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#6c757d;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="gpuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd7e14;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#fd7e14;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="teeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#dc3545;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="decoderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0d6efd;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="displayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#198754;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#198754;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="600" fill="#212529">Protected Content Architecture (Phase 3)</text>
  
  <!-- Browser Process -->
  <rect x="30" y="45" width="840" height="70" rx="10" fill="url(#browserGradient)" stroke="#6c757d" stroke-width="2" filter="url(#shadow3)"/>
  <text x="70" y="70" font-size="12" font-weight="600" fill="#495057">Browser Process</text>
  
  <rect x="50" y="75" width="150" height="30" rx="6" fill="#ffffff" stroke="#6c757d" stroke-width="1"/>
  <text x="125" y="95" text-anchor="middle" font-size="11" font-weight="500" fill="#212529">EME/CDM Interface</text>
  
  <text x="220" y="95" font-size="10" fill="#6c757d">License Request/Response</text>
  <path d="M200 88 L270 88" stroke="#6c757d" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- IPC Arrow -->
  <path d="M125 125 L125 155" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="140" y="145" font-size="10" fill="#6c757d">IPC (Mojo)</text>
  
  <!-- GPU Process -->
  <rect x="30" y="165" width="840" height="350" rx="10" fill="url(#gpuGradient)" stroke="#fd7e14" stroke-width="2" filter="url(#shadow3)"/>
  <text x="70" y="188" font-size="12" font-weight="600" fill="#e65100">GPU Process (Protected Mode)</text>
  
  <!-- ProtectedVideoDecoder container -->
  <rect x="50" y="200" width="800" height="300" rx="8" fill="#ffffff" stroke="#fd7e14" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#fd7e14">ProtectedVideoDecoder</text>
  
  <!-- Top row: CDM Adapter, Encrypted Parser, Protected Buffer Pool -->
  <g transform="translate(70, 235)">
    <rect width="180" height="55" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    <text x="90" y="25" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">CDM Adapter</text>
    <text x="90" y="42" text-anchor="middle" font-size="9" fill="#6c757d">License/Key Management</text>
  </g>
  
  <g transform="translate(290, 235)">
    <rect width="180" height="55" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    <text x="90" y="25" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">Encrypted Parser</text>
    <text x="90" y="42" text-anchor="middle" font-size="9" fill="#6c757d">NAL/OBU Parsing</text>
  </g>
  
  <g transform="translate(510, 235)">
    <rect width="200" height="55" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    <text x="100" y="25" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">Protected Buffer Pool</text>
    <text x="100" y="42" text-anchor="middle" font-size="9" fill="#6c757d">VK_MEMORY_PROPERTY_PROTECTED</text>
  </g>
  
  <!-- Arrows to TEE -->
  <path d="M380 300 L380 320" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow3)"/>
  
  <!-- TEE/Trustlet -->
  <rect x="120" y="330" width="520" height="60" rx="8" fill="url(#teeGradient)" stroke="#dc3545" stroke-width="2"/>
  <text x="380" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#dc3545">Decryption Engine (TEE/Trustlet)</text>
  <text x="380" y="375" text-anchor="middle" font-size="10" fill="#6c757d">Encrypted Slice ---> Decrypt ---> Protected VkBuffer</text>
  
  <!-- Lock icon representation -->
  <g transform="translate(90, 340)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#dc3545" stroke-width="1.5"/>
    <rect x="6" y="12" width="12" height="10" rx="2" fill="#dc3545"/>
    <rect x="9" y="8" width="6" height="6" rx="3" fill="none" stroke="#dc3545" stroke-width="1.5"/>
  </g>
  
  <!-- Arrow to Vulkan Decoder -->
  <path d="M380 400 L380 420" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow3)"/>
  
  <!-- Vulkan Video Decoder -->
  <rect x="120" y="430" width="520" height="55" rx="8" fill="url(#decoderGradient)" stroke="#0d6efd" stroke-width="2"/>
  <text x="380" y="455" text-anchor="middle" font-size="12" font-weight="600" fill="#0d6efd">Vulkan Video Decoder (Protected Queue)</text>
  <text x="380" y="472" text-anchor="middle" font-size="10" fill="#6c757d">Protected VkBuffer ---> Decode ---> Protected VkImage</text>
  
  <!-- Arrow to Display -->
  <path d="M450 525 L450 565" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="525" y="545" font-size="10" fill="#6c757d">(Protected DMA-BUF)</text>
  
  <!-- Display/Compositor -->
  <rect x="200" y="575" width="500" height="55" rx="10" fill="url(#displayGradient)" stroke="#198754" stroke-width="2" filter="url(#shadow3)"/>
  <text x="450" y="600" text-anchor="middle" font-size="13" font-weight="600" fill="#198754">Display / Compositor</text>
  <text x="450" y="618" text-anchor="middle" font-size="10" fill="#6c757d">(Protected Overlay Scanout)</text>
  
  <!-- Security indicators -->
  <g transform="translate(740, 240)">
    <rect width="90" height="80" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="9" font-weight="600" fill="#856404">Security</text>
    <text x="45" y="35" text-anchor="middle" font-size="8" fill="#856404">Protected</text>
    <text x="45" y="48" text-anchor="middle" font-size="8" fill="#856404">Memory</text>
    <text x="45" y="65" text-anchor="middle" font-size="8" fill="#856404">TEE</text>
    <text x="45" y="78" text-anchor="middle" font-size="8" fill="#856404">Isolation</text>
  </g>
</svg>

