<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1320" height="1000" fill="#ffffff"/>
  <defs>
    <linearGradient id="badG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcdd2"/><stop offset="100%" stop-color="#ef9a9a"/>
    </linearGradient>
    <linearGradient id="okG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6c9"/><stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="cliG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="libG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1c4e9"/><stop offset="100%" stop-color="#b39ddb"/>
    </linearGradient>
    <linearGradient id="warnG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/><stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="660" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">
    Encoder Input Interface — Current vs. Proposed (API v2)
  </text>
  <text x="660" y="57" text-anchor="middle" font-size="12" fill="#546e7a">
    v1 takes a raw VkImage, which silently mandates a caller-owned compatible VkDevice. The two consumers are not two designs — they are two workarounds for one missing feature: the library cannot import.
  </text>

  <!-- =================== CURRENT =================== -->
  <rect x="20" y="76" width="1280" height="404" rx="12" fill="#fff8f6" stroke="#e57373" stroke-width="2.5"/>
  <rect x="20" y="76" width="150" height="28" rx="12" fill="#c62828"/>
  <text x="95" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">CURRENT (v1)</text>
  <text x="660" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b71c1c">Two divergent paths to the same entry point — SubmitExternalFrame(VkImage)</text>

  <!-- Chromium column -->
  <rect x="45" y="118" width="580" height="246" rx="10" fill="#f6f9ff" stroke="#64b5f6" stroke-width="2"/>
  <text x="335" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">CONSUMER A — Chromium (BYO VkDevice, same-device)</text>

  <rect x="65" y="152" width="240" height="46" rx="6" fill="url(#cliG)" stroke="#1976d2"/>
  <text x="185" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">SharedImage (Ozone backing)</text>
  <text x="185" y="188" text-anchor="middle" font-size="10" fill="#37474f">recycled from an 8-slot pool</text>

  <rect x="65" y="212" width="240" height="60" rx="6" fill="url(#badG)" stroke="#c62828" stroke-width="2"/>
  <text x="185" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">ProduceVulkanVideo — PER FRAME</text>
  <text x="185" y="247" text-anchor="middle" font-size="9.5" fill="#37474f">ExportHandle() = CloneHandleForIPC</text>
  <text x="185" y="261" text-anchor="middle" font-size="9.5" fill="#37474f">→ dup() × planes</text>

  <rect x="65" y="286" width="240" height="60" rx="6" fill="url(#badG)" stroke="#c62828" stroke-width="2"/>
  <text x="185" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">import — PER FRAME</text>
  <text x="185" y="321" text-anchor="middle" font-size="9.5" fill="#37474f">vkAllocateMemory + vkCreateImage</text>
  <text x="185" y="335" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b71c1c">60 / second at 4K60</text>

  <rect x="345" y="152" width="260" height="194" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-dasharray="4,3"/>
  <text x="475" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">Why it looks "zero-copy"</text>
  <text x="475" y="192" text-anchor="middle" font-size="9.5" fill="#546e7a">The PIXELS are never copied — true.</text>
  <text x="475" y="207" text-anchor="middle" font-size="9.5" fill="#546e7a">But the IMPORT is redone every frame,</text>
  <text x="475" y="222" text-anchor="middle" font-size="9.5" fill="#546e7a">uncached (vulkan_video_encode_</text>
  <text x="475" y="236" text-anchor="middle" font-size="9.5" fill="#546e7a">accelerator.cc:1047).</text>
  <text x="475" y="260" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c62828">And the FD cannot be recovered from</text>
  <text x="475" y="274" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c62828">the resulting VkImage: allocated</text>
  <text x="475" y="288" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c62828">import-only (handle_types_ == 0).</text>
  <text x="475" y="308" text-anchor="middle" font-size="9.5" fill="#546e7a">Re-enabling export reintroduces the</text>
  <text x="475" y="322" text-anchor="middle" font-size="9.5" fill="#546e7a">NVIDIA zero-filled-allocation bug</text>
  <text x="475" y="336" text-anchor="middle" font-size="9.5" fill="#546e7a">→ solid-black encodes.</text>

  <!-- TRV column -->
  <rect x="645" y="118" width="630" height="246" rx="10" fill="#f4fbf4" stroke="#81c784" stroke-width="2"/>
  <text x="960" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">CONSUMER B — TRV (BYO VkInstance only, cross-device)</text>

  <rect x="665" y="152" width="250" height="46" rx="6" fill="url(#cliG)" stroke="#1976d2"/>
  <text x="790" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">render device → dma-buf FD</text>
  <text x="790" y="188" text-anchor="middle" font-size="10" fill="#37474f">(Win32: NT handle)</text>

  <rect x="665" y="212" width="250" height="60" rx="6" fill="url(#warnG)" stroke="#ef6c00" stroke-width="2"/>
  <text x="790" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">importDmaBufForEncoder()</text>
  <text x="790" y="247" text-anchor="middle" font-size="9.5" fill="#37474f">TRV's OWN import code, onto</text>
  <text x="790" y="261" text-anchor="middle" font-size="9.5" fill="#37474f">encoderLib-&gt;GetVkDevice()</text>

  <rect x="665" y="286" width="250" height="60" rx="6" fill="url(#warnG)" stroke="#ef6c00" stroke-width="2"/>
  <text x="790" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">cross-device semaphore import</text>
  <text x="790" y="321" text-anchor="middle" font-size="9.5" fill="#37474f">export/import timeline sems by hand</text>
  <text x="790" y="335" text-anchor="middle" font-size="9.5" fill="#37474f">(vkImportSemaphoreFdKHR)</text>

  <rect x="945" y="152" width="310" height="194" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-dasharray="4,3"/>
  <text x="1100" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">The cost of caller-side import</text>
  <text x="1100" y="193" text-anchor="middle" font-size="9.5" fill="#546e7a">Vulkan's ownership rules are asymmetric:</text>
  <text x="1100" y="207" text-anchor="middle" font-size="9.5" fill="#546e7a">POSIX consumes the fd (on NVIDIA even on</text>
  <text x="1100" y="221" text-anchor="middle" font-size="9.5" fill="#546e7a">FAILURE); Win32 consumes nothing.</text>
  <text x="1100" y="242" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c62828">Both predictable bugs are present today:</text>
  <text x="1100" y="258" text-anchor="middle" font-size="9.5" fill="#37474f">• double-close — EncoderInstance.cpp</text>
  <text x="1100" y="272" text-anchor="middle" font-size="9.5" fill="#37474f">  :2229-2234 then again at :2419-2429</text>
  <text x="1100" y="288" text-anchor="middle" font-size="9.5" fill="#37474f">• NT-handle leak — EncoderImportSlot</text>
  <text x="1100" y="302" text-anchor="middle" font-size="9.5" fill="#37474f">  has no handle field; nothing closes it</text>
  <text x="1100" y="325" text-anchor="middle" font-size="9.5" font-style="italic" fill="#546e7a">One codebase, both errors, each in the</text>
  <text x="1100" y="339" text-anchor="middle" font-size="9.5" font-style="italic" fill="#546e7a">direction its platform's rule pushes you.</text>

  <line x1="185" y1="198" x2="185" y2="212" stroke="#c62828" stroke-width="2" marker-end="url(#arR)"/>
  <line x1="185" y1="272" x2="185" y2="286" stroke="#c62828" stroke-width="2" marker-end="url(#arR)"/>
  <line x1="790" y1="198" x2="790" y2="212" stroke="#ef6c00" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="790" y1="272" x2="790" y2="286" stroke="#ef6c00" stroke-width="2" marker-end="url(#ar)"/>

  <!-- converge -->
  <rect x="420" y="392" width="480" height="52" rx="8" fill="url(#badG)" stroke="#c62828" stroke-width="2.5"/>
  <text x="660" y="413" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b71c1c">v1: SubmitExternalFrame(VkImage, VkSemaphore*)</text>
  <text x="660" y="431" text-anchor="middle" font-size="10" fill="#37474f">a VkImage is meaningless off its device ⇒ the caller MUST solve device compatibility itself</text>
  <path d="M 185 346 L 185 370 L 500 370 L 500 392" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#arR)"/>
  <path d="M 790 346 L 790 370 L 820 370 L 820 392" fill="none" stroke="#ef6c00" stroke-width="2" marker-end="url(#ar)"/>

  <text x="660" y="464" text-anchor="middle" font-size="10.5" fill="#b71c1c">Downstream divergence all descends from this one gap: who owns the fd · who validates the modifier · who applies the FOREIGN acquire · whether imports are cached · the AUTO residency heuristic</text>

  <!-- =================== PROPOSED =================== -->
  <rect x="20" y="500" width="1280" height="472" rx="12" fill="#f4fbf4" stroke="#2e7d32" stroke-width="2.5"/>
  <rect x="20" y="500" width="170" height="28" rx="12" fill="#2e7d32"/>
  <text x="105" y="519" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">PROPOSED (v2)</text>
  <text x="680" y="519" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b5e20">One path. The library owns import. Registration is the cache.</text>

  <!-- both consumers -->
  <rect x="45" y="546" width="290" height="88" rx="8" fill="url(#cliG)" stroke="#1976d2" stroke-width="2"/>
  <text x="190" y="567" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">Chromium</text>
  <text x="190" y="585" text-anchor="middle" font-size="10" fill="#37474f">gfx::NativePixmapHandle →</text>
  <text x="190" y="600" text-anchor="middle" font-size="10" fill="#37474f">descriptor by FIELD COPY</text>
  <text x="190" y="619" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">planes[{fd,stride,offset,size}] + modifier</text>

  <rect x="45" y="650" width="290" height="88" rx="8" fill="url(#cliG)" stroke="#1976d2" stroke-width="2"/>
  <text x="190" y="671" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">TRV</text>
  <text x="190" y="689" text-anchor="middle" font-size="10" fill="#37474f">its FrameData encoder subset →</text>
  <text x="190" y="704" text-anchor="middle" font-size="10" fill="#37474f">the same descriptor</text>
  <text x="190" y="723" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">importDmaBufForEncoder() DELETED</text>

  <text x="190" y="762" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2e7d32">Both fill one pointer-free POD.</text>
  <text x="190" y="777" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2e7d32">The struct IS the Mojo payload.</text>

  <!-- registration -->
  <rect x="375" y="546" width="310" height="192" rx="8" fill="url(#okG)" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="530" y="568" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b5e20">RegisterImageResource()</text>
  <text x="530" y="586" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">ONCE per producer pool slot</text>
  <text x="530" y="606" text-anchor="middle" font-size="9.5" fill="#37474f">descriptor + OS handle (FD / NT handle)</text>
  <text x="530" y="622" text-anchor="middle" font-size="9.5" fill="#37474f">→ vkCreateImage + vkAllocateMemory(import)</text>
  <text x="530" y="636" text-anchor="middle" font-size="9.5" fill="#37474f">→ bind + view</text>
  <text x="530" y="656" text-anchor="middle" font-size="9.5" fill="#37474f">validates: format · modifier · usage ·</text>
  <text x="530" y="670" text-anchor="middle" font-size="9.5" fill="#37474f">memory type · device UUID · plane layout</text>
  <text x="530" y="690" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">returns VkVideoEncoderResource (uint64)</text>
  <text x="530" y="706" text-anchor="middle" font-size="9.5" fill="#37474f">generation-counted · IPC-safe · never a pointer</text>
  <text x="530" y="726" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c62828">fails HERE, once — not per-frame forever</text>

  <!-- submit -->
  <rect x="725" y="546" width="270" height="88" rx="8" fill="url(#okG)" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="860" y="568" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b5e20">SubmitFrame(resourceId, …)</text>
  <text x="860" y="587" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">PER FRAME — zero allocations</text>
  <text x="860" y="604" text-anchor="middle" font-size="9.5" fill="#37474f">names the registration; no import,</text>
  <text x="860" y="618" text-anchor="middle" font-size="9.5" fill="#37474f">no dup(), no validation re-run</text>

  <rect x="725" y="650" width="270" height="88" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="860" y="671" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e7d32">Unregister → refcounted retire</text>
  <text x="860" y="689" text-anchor="middle" font-size="9.5" fill="#37474f">marks + returns; never blocks</text>
  <text x="860" y="704" text-anchor="middle" font-size="9.5" fill="#37474f">destroyed only at refcount 0</text>
  <text x="860" y="722" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e7d32">no vkDeviceWaitIdle, no Xid 31</text>

  <rect x="1035" y="546" width="240" height="192" rx="8" fill="url(#libG)" stroke="#4527a0" stroke-width="2"/>
  <text x="1155" y="568" text-anchor="middle" font-size="12" font-weight="bold" fill="#311b92">Library owns import</text>
  <text x="1155" y="588" text-anchor="middle" font-size="9.5" fill="#37474f">• one ownership rule, absorbing</text>
  <text x="1155" y="602" text-anchor="middle" font-size="9.5" fill="#37474f">  the POSIX/Win32 asymmetry</text>
  <text x="1155" y="620" text-anchor="middle" font-size="9.5" fill="#37474f">• FOREIGN residency DERIVED,</text>
  <text x="1155" y="634" text-anchor="middle" font-size="9.5" fill="#37474f">  not asked (AUTO retired)</text>
  <text x="1155" y="652" text-anchor="middle" font-size="9.5" fill="#37474f">• real VkImageCreateInfo, never</text>
  <text x="1155" y="666" text-anchor="middle" font-size="9.5" fill="#37474f">  fabricated usage flags</text>
  <text x="1155" y="684" text-anchor="middle" font-size="9.5" fill="#37474f">• typed status: renegotiable vs</text>
  <text x="1155" y="698" text-anchor="middle" font-size="9.5" fill="#37474f">  fatal, distinguishable</text>
  <text x="1155" y="718" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#311b92">reusable by the DECODER later</text>

  <line x1="335" y1="590" x2="375" y2="600" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arG)"/>
  <line x1="335" y1="694" x2="375" y2="670" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arG)"/>
  <line x1="685" y1="590" x2="725" y2="590" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arG)"/>
  <line x1="685" y1="694" x2="725" y2="694" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arG)"/>
  <line x1="995" y1="640" x2="1035" y2="640" stroke="#4527a0" stroke-width="2" marker-end="url(#ar)"/>

  <!-- cross-process band -->
  <rect x="45" y="800" width="1230" height="56" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="660" y="822" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">The SAME path works out-of-process — that is the point of handle exchange</text>
  <text x="660" y="842" text-anchor="middle" font-size="10" fill="#37474f">descriptor = 1:1 Mojo struct · handle rides out-of-band (SCM_RIGHTS / handle&lt;platform&gt;) · resourceId is a plain uint64 · release fences MUST be SYNC_FD (an OPAQUE_FD timeline never force-signals on peer death → hung tab)</text>

  <!-- scoreboard -->
  <rect x="45" y="874" width="1230" height="82" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <text x="660" y="896" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37474f">Steady state, 4K60, 8-slot producer pool</text>
  <text x="330" y="920" text-anchor="middle" font-size="11" fill="#c62828">CURRENT: 60 × (dup + vkAllocateMemory + vkCreateImage) per second, forever</text>
  <text x="990" y="920" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">PROPOSED: 8 imports total, then zero</text>
  <text x="660" y="944" text-anchor="middle" font-size="10.5" font-style="italic" fill="#546e7a">Unification is not a cost to justify — it is cheaper than the status quo, and it removes a dangling-VkImage cache bug that any same-device fast path would have shipped.</text>
</svg>
