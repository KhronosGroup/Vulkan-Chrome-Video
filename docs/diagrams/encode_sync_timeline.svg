<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="signal" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2"/>
    </marker>
    <marker id="wait" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b1fa2"/>
    </marker>
  </defs>

  <text x="640" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">
    Cross-Queue Synchronization Timeline (Vulkan Video Encode)
  </text>
  <text x="640" y="52" text-anchor="middle" font-size="12" fill="#546e7a">
    Three queues from the same VkDevice; coordination via a single VkSemaphore (timeline)
  </text>

  <!-- Queues -->
  <g font-size="13" font-weight="bold">
    <rect x="20" y="80" width="180" height="36" rx="6" fill="#bbdefb" stroke="#1976d2"/>
    <text x="110" y="103" text-anchor="middle">Graphics queue</text>

    <rect x="20" y="240" width="180" height="36" rx="6" fill="#c5cae9" stroke="#3949ab"/>
    <text x="110" y="263" text-anchor="middle">Transfer queue (optional)</text>

    <rect x="20" y="400" width="180" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="110" y="423" text-anchor="middle">Video encode queue</text>

    <rect x="20" y="560" width="180" height="36" rx="6" fill="#fff9c4" stroke="#f9a825"/>
    <text x="110" y="583" text-anchor="middle">CPU (encoder task)</text>
  </g>

  <!-- Timeline axes -->
  <line x1="200" y1="98"  x2="1240" y2="98"  stroke="#90a4ae" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="200" y1="258" x2="1240" y2="258" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="200" y1="418" x2="1240" y2="418" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="200" y1="578" x2="1240" y2="578" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4,4"/>

  <text x="1250" y="105" font-size="11" fill="#546e7a">time →</text>
  <text x="1250" y="265" font-size="11" fill="#546e7a">time →</text>
  <text x="1250" y="425" font-size="11" fill="#546e7a">time →</text>
  <text x="1250" y="585" font-size="11" fill="#546e7a">time →</text>

  <!-- Work blocks -->
  <!-- Graphics work: produce a frame -->
  <rect x="240" y="80" width="200" height="36" rx="4" fill="#90caf9" stroke="#1565c0"/>
  <text x="340" y="103" text-anchor="middle" font-size="12">Compositor renders SharedImage</text>

  <!-- Signal timeline=1 from graphics -->
  <line x1="440" y1="116" x2="440" y2="160" stroke="#1976d2" stroke-width="2" marker-end="url(#signal)"/>
  <text x="455" y="142" font-size="11" fill="#1976d2">signal sem = 1</text>

  <!-- timeline semaphore bar -->
  <rect x="200" y="160" width="1040" height="40" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-dasharray="2,2"/>
  <text x="720" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">VkSemaphore (timeline) — monotonically increasing value</text>

  <!-- Encode wait sem=1 -->
  <line x1="440" y1="200" x2="440" y2="400" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="455" y="290" font-size="11" fill="#7b1fa2">wait sem e 1</text>

  <!-- Encode work: VIDEO_ENCODE_SRC barrier + vkCmdEncodeVideoKHR -->
  <rect x="440" y="400" width="320" height="36" rx="4" fill="#a5d6a7" stroke="#1b5e20"/>
  <text x="600" y="423" text-anchor="middle" font-size="12">vkCmdEncodeVideoKHR (frame N)</text>

  <!-- Signal timeline=2 -->
  <line x1="760" y1="400" x2="760" y2="160" stroke="#2e7d32" stroke-width="2" marker-end="url(#signal)"/>
  <text x="780" y="280" font-size="11" fill="#2e7d32">signal sem = 2</text>

  <!-- CPU wait seme2 -->
  <line x1="760" y1="200" x2="760" y2="560" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="780" y="450" font-size="11" fill="#7b1fa2">wait sem e 2</text>

  <!-- CPU readback -->
  <rect x="760" y="560" width="260" height="36" rx="4" fill="#fff59d" stroke="#f9a825"/>
  <text x="890" y="583" text-anchor="middle" font-size="12">vkGetQueryPoolResults + memcpy</text>

  <!-- Mojo back to renderer -->
  <line x1="1020" y1="578" x2="1100" y2="578" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1130" y="582" font-size="11">BitstreamBufferReady</text>

  <!-- Frame N+1 starting (next compositor pass) -->
  <rect x="900" y="80" width="200" height="36" rx="4" fill="#90caf9" stroke="#1565c0"/>
  <text x="1000" y="103" text-anchor="middle" font-size="12">Compositor produces frame N+1</text>
  <line x1="1100" y1="116" x2="1100" y2="160" stroke="#1976d2" stroke-width="2" marker-end="url(#signal)"/>
  <text x="1115" y="142" font-size="11" fill="#1976d2">signal = 3</text>

  <!-- Legend -->
  <rect x="20" y="610" width="14" height="14" fill="#90caf9" stroke="#1565c0"/>
  <text x="40" y="622" font-size="11">Graphics work</text>

  <rect x="170" y="610" width="14" height="14" fill="#a5d6a7" stroke="#1b5e20"/>
  <text x="190" y="622" font-size="11">Video encode work</text>

  <rect x="330" y="610" width="14" height="14" fill="#fff59d" stroke="#f9a825"/>
  <text x="350" y="622" font-size="11">CPU readback</text>

  <line x1="470" y1="618" x2="500" y2="618" stroke="#1976d2" stroke-width="2" marker-end="url(#signal)"/>
  <text x="510" y="622" font-size="11" fill="#1976d2">signal timeline</text>

  <line x1="620" y1="618" x2="650" y2="618" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="660" y="622" font-size="11" fill="#7b1fa2">wait timeline</text>

  <text x="800" y="622" font-size="11" fill="#546e7a">
    sync2 + timeline semaphores; no fences on the hot path.
  </text>
</svg>
