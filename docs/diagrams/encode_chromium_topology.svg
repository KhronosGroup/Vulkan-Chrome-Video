<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="rendererG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="gpuG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="hwG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="newG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>

  <text x="550" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">
    Chromium Video Encode — Backend Topology (with proposed Vulkan path)
  </text>

  <!-- Renderer Process -->
  <rect x="60" y="60" width="980" height="120" rx="8" fill="url(#rendererG)" stroke="#1976d2" stroke-width="2"/>
  <text x="550" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">Renderer Process</text>

  <rect x="100" y="105" width="200" height="60" rx="6" fill="#ffffff" stroke="#1976d2"/>
  <text x="200" y="130" text-anchor="middle" font-size="13" font-weight="bold">WebCodecs</text>
  <text x="200" y="150" text-anchor="middle" font-size="11">Blink::VideoEncoder</text>

  <rect x="370" y="105" width="200" height="60" rx="6" fill="#ffffff" stroke="#1976d2"/>
  <text x="470" y="130" text-anchor="middle" font-size="13" font-weight="bold">WebRTC</text>
  <text x="470" y="150" text-anchor="middle" font-size="11">RTCPeerConnection</text>

  <rect x="640" y="105" width="200" height="60" rx="6" fill="#ffffff" stroke="#1976d2"/>
  <text x="740" y="130" text-anchor="middle" font-size="13" font-weight="bold">MediaRecorder</text>
  <text x="740" y="150" text-anchor="middle" font-size="11">Tab capture, getDisplayMedia</text>

  <!-- Mojo IPC arrow -->
  <line x1="550" y1="180" x2="550" y2="220" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="585" y="205" font-size="12" fill="#37474f">Mojo IPC</text>

  <!-- GPU Process -->
  <rect x="60" y="220" width="980" height="320" rx="8" fill="url(#gpuG)" stroke="#f57c00" stroke-width="2"/>
  <text x="550" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#bf360c">GPU Process</text>

  <!-- Mojo service -->
  <rect x="370" y="265" width="360" height="50" rx="6" fill="#ffffff" stroke="#f57c00"/>
  <text x="550" y="295" text-anchor="middle" font-size="13" font-weight="bold">MojoVideoEncodeAcceleratorService</text>

  <!-- Factory -->
  <line x1="550" y1="315" x2="550" y2="345" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="345" width="540" height="55" rx="6" fill="#ffffff" stroke="#f57c00"/>
  <text x="550" y="370" text-anchor="middle" font-size="13" font-weight="bold">GpuVideoEncodeAcceleratorFactory::CreateVEA()</text>
  <text x="550" y="388" text-anchor="middle" font-size="11" fill="#5d4037">walks GetVEAFactoryFunctions() — first match returns OK</text>

  <!-- Five backends -->
  <rect x="80" y="430" width="160" height="80" rx="6" fill="#ffffff" stroke="#9e9e9e"/>
  <text x="160" y="455" text-anchor="middle" font-size="12" font-weight="bold">VaapiVEA</text>
  <text x="160" y="473" text-anchor="middle" font-size="10" fill="#616161">media/gpu/vaapi/</text>
  <text x="160" y="490" text-anchor="middle" font-size="10">Linux / ChromeOS</text>

  <rect x="260" y="430" width="160" height="80" rx="6" fill="#ffffff" stroke="#9e9e9e"/>
  <text x="340" y="455" text-anchor="middle" font-size="12" font-weight="bold">V4L2VEA</text>
  <text x="340" y="473" text-anchor="middle" font-size="10" fill="#616161">media/gpu/v4l2/</text>
  <text x="340" y="490" text-anchor="middle" font-size="10">ARM / ChromeOS</text>

  <rect x="440" y="430" width="160" height="80" rx="6" fill="#ffffff" stroke="#9e9e9e"/>
  <text x="520" y="455" text-anchor="middle" font-size="12" font-weight="bold">D3D12VEA + MF VEA</text>
  <text x="520" y="473" text-anchor="middle" font-size="10" fill="#616161">media/gpu/windows/</text>
  <text x="520" y="490" text-anchor="middle" font-size="10">Windows</text>

  <rect x="620" y="430" width="160" height="80" rx="6" fill="#ffffff" stroke="#9e9e9e"/>
  <text x="700" y="455" text-anchor="middle" font-size="12" font-weight="bold">NdkVEA + VT VEA</text>
  <text x="700" y="473" text-anchor="middle" font-size="10" fill="#616161">media/gpu/android, mac/</text>
  <text x="700" y="490" text-anchor="middle" font-size="10">Android / macOS</text>

  <!-- NEW Vulkan backend -->
  <rect x="800" y="430" width="200" height="80" rx="6" fill="url(#newG)" stroke="#2e7d32" stroke-width="3"/>
  <text x="900" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">VulkanVideoEncodeAccelerator</text>
  <text x="900" y="473" text-anchor="middle" font-size="10" fill="#1b5e20">media/gpu/vulkan/ (NEW)</text>
  <text x="900" y="490" text-anchor="middle" font-size="10" fill="#1b5e20">Cross-platform</text>
  <text x="900" y="504" text-anchor="middle" font-size="10" fill="#1b5e20">(Linux, Android, Windows)</text>

  <line x1="550" y1="400" x2="160" y2="430" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="400" x2="340" y2="430" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="400" x2="520" y2="430" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="400" x2="700" y2="430" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="400" x2="900" y2="430" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- HW layer -->
  <rect x="60" y="570" width="980" height="120" rx="8" fill="url(#hwG)" stroke="#7b1fa2" stroke-width="2"/>
  <text x="550" y="596" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a148c">Hardware Acceleration Drivers</text>

  <rect x="100" y="615" width="120" height="55" rx="6" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="160" y="638" text-anchor="middle" font-size="12" font-weight="bold">libva</text>
  <text x="160" y="655" text-anchor="middle" font-size="10">Intel/AMD Mesa</text>

  <rect x="240" y="615" width="120" height="55" rx="6" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="300" y="638" text-anchor="middle" font-size="12" font-weight="bold">V4L2 kernel</text>
  <text x="300" y="655" text-anchor="middle" font-size="10">stateless m2m</text>

  <rect x="380" y="615" width="160" height="55" rx="6" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="460" y="638" text-anchor="middle" font-size="12" font-weight="bold">DirectX 12 Video</text>
  <text x="460" y="655" text-anchor="middle" font-size="10">Media Foundation</text>

  <rect x="560" y="615" width="160" height="55" rx="6" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="640" y="638" text-anchor="middle" font-size="12" font-weight="bold">MediaCodec / VTB</text>
  <text x="640" y="655" text-anchor="middle" font-size="10">Android / Apple</text>

  <rect x="740" y="615" width="280" height="55" rx="6" fill="#dcedc8" stroke="#33691e" stroke-width="2"/>
  <text x="880" y="638" text-anchor="middle" font-size="13" font-weight="bold" fill="#33691e">Vulkan Loader → ICD</text>
  <text x="880" y="655" text-anchor="middle" font-size="10" fill="#33691e">VK_KHR_video_encode_queue / VK_KHR_video_encode_h264/h265/av1</text>

  <line x1="160" y1="510" x2="160" y2="615" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="510" x2="300" y2="615" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="510" x2="460" y2="615" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="510" x2="640" y2="615" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="510" x2="880" y2="615" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="60" y="700" width="20" height="14" fill="url(#newG)" stroke="#2e7d32" stroke-width="2"/>
  <text x="88" y="711" font-size="11" fill="#37474f">= Proposed Vulkan Video Encode integration (this design)</text>
</svg>
