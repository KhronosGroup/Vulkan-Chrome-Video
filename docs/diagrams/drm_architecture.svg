<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800">
  <defs>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ADE80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <!-- Lock icon -->
    <symbol id="lock" viewBox="0 0 20 20">
      <rect x="3" y="8" width="14" height="10" rx="2" fill="currentColor"/>
      <path d="M6 8V6a4 4 0 1 1 8 0v2" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="800" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">
    Protected Content (DRM) Architecture in Chromium
  </text>
  
  <!-- Browser Process Section -->
  <rect x="40" y="55" width="1020" height="180" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Browser Process</text>
  
  <!-- Web App -->
  <rect x="60" y="95" width="140" height="70" rx="6" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <text x="130" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Web Application</text>
  <text x="130" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">&lt;video&gt; + EME API</text>
  
  <!-- EME -->
  <rect x="230" y="95" width="140" height="70" rx="6" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <text x="300" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">EME</text>
  <text x="300" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">Encrypted Media</text>
  <text x="300" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">Extensions</text>
  
  <!-- CDM Host -->
  <rect x="400" y="95" width="160" height="70" rx="6" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <text x="480" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">CDM Host</text>
  <text x="480" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">Content Decryption</text>
  <text x="480" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dbeafe">Module Interface</text>
  
  <!-- Widevine CDM -->
  <rect x="590" y="95" width="160" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <use href="#lock" x="680" y="100" width="16" height="16" fill="#92400e"/>
  <text x="670" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Widevine CDM</text>
  <text x="670" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b45309">License Request</text>
  <text x="670" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b45309">Key Management</text>
  
  <!-- License Server -->
  <rect x="780" y="95" width="140" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">License Server</text>
  <text x="850" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">DRM Backend</text>
  <text x="850" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">(External)</text>
  
  <!-- License flow -->
  <rect x="400" y="180" width="540" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="670" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">
    License Exchange: Challenge → Server → License Response → Keys
  </text>
  
  <!-- GPU Process Section -->
  <rect x="40" y="250" width="1020" height="240" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">GPU Process</text>
  
  <!-- Mojo Video Decoder -->
  <rect x="60" y="295" width="180" height="80" rx="6" fill="url(#gpuGrad)" filter="url(#shadow)"/>
  <text x="150" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">MojoVideoDecoder</text>
  <text x="150" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Service</text>
  <text x="150" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fef3c7">Receives encrypted DecoderBuffer</text>
  
  <!-- Vaapi Video Decoder -->
  <rect x="280" y="295" width="180" height="80" rx="6" fill="url(#gpuGrad)" filter="url(#shadow)"/>
  <text x="370" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">VaapiVideoDecoder</text>
  <text x="370" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fef3c7">DecryptConfig</text>
  <text x="370" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fef3c7">SubsampleEntries</text>
  
  <!-- Vaapi Decoder Delegate -->
  <rect x="500" y="295" width="200" height="80" rx="6" fill="url(#gpuGrad)" filter="url(#shadow)"/>
  <use href="#lock" x="620" y="300" width="14" height="14" fill="#fff"/>
  <text x="600" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">VaapiVideoDecoder</text>
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Delegate</text>
  <text x="600" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fef3c7">SetupDecryptDecode()</text>
  
  <!-- ChromeOS CDM Context -->
  <rect x="740" y="295" width="180" height="80" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <use href="#lock" x="850" y="300" width="14" height="14" fill="#166534"/>
  <text x="830" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">ChromeOsCdm</text>
  <text x="830" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">Context</text>
  <text x="830" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#15803d">GetHwConfigData()</text>
  
  <!-- Protected Session Box -->
  <rect x="280" y="400" width="420" height="70" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">VAEncryptionParameters</text>
  <text x="300" y="448" font-family="monospace" font-size="9" fill="#64748b">encryption_type: VA_ENCRYPTION_TYPE_SUBSAMPLE_CTR</text>
  <text x="300" y="462" font-family="monospace" font-size="9" fill="#64748b">wrapped_decrypt_blob[16], segment_info[], iv[]</text>
  
  <!-- Hardware TEE Section -->
  <rect x="40" y="505" width="1020" height="130" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Hardware Trusted Execution Environment (TEE)</text>
  
  <!-- VA-API Protected Session -->
  <rect x="100" y="545" width="200" height="70" rx="6" fill="url(#teeGrad)" filter="url(#shadow)"/>
  <use href="#lock" x="220" y="550" width="14" height="14" fill="#fff"/>
  <text x="200" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">VA-API Protected</text>
  <text x="200" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Session</text>
  <text x="200" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fecaca">vaCreateProtectedSession()</text>
  
  <!-- HW Key Unwrap -->
  <rect x="340" y="545" width="200" height="70" rx="6" fill="url(#teeGrad)" filter="url(#shadow)"/>
  <use href="#lock" x="460" y="550" width="14" height="14" fill="#fff"/>
  <text x="440" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Hardware Key</text>
  <text x="440" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Unwrap Engine</text>
  <text x="440" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fecaca">AES-256 in secure enclave</text>
  
  <!-- Secure Decode -->
  <rect x="580" y="545" width="200" height="70" rx="6" fill="url(#teeGrad)" filter="url(#shadow)"/>
  <use href="#lock" x="700" y="550" width="14" height="14" fill="#fff"/>
  <text x="680" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Secure Video</text>
  <text x="680" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Decode Engine</text>
  <text x="680" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fecaca">Decrypts while decoding</text>
  
  <!-- Protected Output -->
  <rect x="820" y="545" width="200" height="70" rx="6" fill="url(#secureGrad)" filter="url(#shadow)"/>
  <use href="#lock" x="940" y="550" width="14" height="14" fill="#fff"/>
  <text x="920" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Protected</text>
  <text x="920" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Output Surface</text>
  <text x="920" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dcfce7">Clear pixels in protected memory</text>
  
  <!-- Display Section -->
  <rect x="40" y="650" width="1020" height="120" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="60" y="675" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Secure Display Path</text>
  
  <!-- HDCP -->
  <rect x="250" y="690" width="200" height="60" rx="6" fill="url(#secureGrad)" filter="url(#shadow)"/>
  <use href="#lock" x="370" y="695" width="14" height="14" fill="#fff"/>
  <text x="350" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">HDCP Encryption</text>
  <text x="350" y="737" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dcfce7">Protected link to display</text>
  
  <!-- Display -->
  <rect x="550" y="690" width="200" height="60" rx="6" fill="#fff" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">Display Output</text>
  <text x="650" y="737" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#15803d">Decrypted at display only</text>
  
  <!-- Arrows -->
  <!-- Browser Process -->
  <line x1="200" y1="130" x2="230" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="130" x2="400" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="130" x2="590" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="130" x2="780" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- To GPU Process -->
  <line x1="150" y1="235" x2="150" y2="295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- GPU Process internal -->
  <line x1="240" y1="335" x2="280" y2="335" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="335" x2="500" y2="335" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="335" x2="740" y2="335" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- To Protected Session params -->
  <line x1="600" y1="375" x2="490" y2="400" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- To TEE -->
  <line x1="490" y1="470" x2="200" y2="545" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="490" y1="470" x2="440" y2="545" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="490" y1="470" x2="680" y2="545" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  
  <!-- TEE internal -->
  <line x1="300" y1="580" x2="340" y2="580" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="580" x2="580" y2="580" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="580" x2="820" y2="580" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- To Display -->
  <line x1="920" y1="615" x2="920" y2="650" stroke="#22c55e" stroke-width="2"/>
  <line x1="920" y1="650" x2="350" y2="690" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="450" y1="720" x2="550" y2="720" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- Legend -->
  <rect x="40" y="778" width="400" height="18" rx="4" fill="#ef4444"/>
  <text x="240" y="791" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">
    🔒 Content keys NEVER leave hardware security boundary
  </text>
</svg>

