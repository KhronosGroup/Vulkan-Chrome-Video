<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gpuG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="cpuG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>

  <text x="590" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">
    Encode Bitstream Readback Path (Vulkan Video)
  </text>

  <!-- GPU domain -->
  <rect x="40" y="60" width="540" height="540" rx="8" fill="#f1f8e9" stroke="#558b2f" stroke-width="2"/>
  <text x="310" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#33691e">GPU domain</text>

  <rect x="60" y="115" width="500" height="80" rx="6" fill="url(#gpuG)" stroke="#2e7d32"/>
  <text x="310" y="138" text-anchor="middle" font-size="12" font-weight="bold">vkCmdEncodeVideoKHR</text>
  <text x="310" y="156" text-anchor="middle" font-size="10">encode_info.dstBuffer = bitstream_vk_buf_</text>
  <text x="310" y="170" text-anchor="middle" font-size="10">encode_info.dstBufferOffset / dstBufferRange</text>
  <text x="310" y="186" text-anchor="middle" font-size="10">+ inline-query (VK_KHR_video_maintenance1)</text>

  <line x1="310" y1="195" x2="310" y2="225" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="225" width="500" height="100" rx="6" fill="url(#gpuG)" stroke="#2e7d32" stroke-width="2"/>
  <text x="310" y="248" text-anchor="middle" font-size="12" font-weight="bold">HW writes bitstream</text>
  <text x="310" y="265" text-anchor="middle" font-size="10" fill="#1b5e20">VkBuffer (VK_BUFFER_USAGE_VIDEO_ENCODE_DST_BIT_KHR)</text>
  <text x="310" y="280" text-anchor="middle" font-size="10">| AUD | &lt;SPS&gt; | &lt;PPS&gt; | &lt;slice 0&gt; | &lt;slice 1&gt; | ... |</text>
  <text x="310" y="297" text-anchor="middle" font-size="10" fill="#bf360c">— but Vulkan H.264 enc may only write slices —</text>
  <text x="310" y="313" text-anchor="middle" font-size="10">we prepend SPS/PPS bytes manually</text>

  <line x1="310" y1="325" x2="310" y2="355" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="355" width="500" height="105" rx="6" fill="url(#gpuG)" stroke="#2e7d32"/>
  <text x="310" y="378" text-anchor="middle" font-size="12" font-weight="bold">VK_QUERY_TYPE_VIDEO_ENCODE_FEEDBACK_KHR</text>
  <text x="80" y="397" font-size="10">queryPool slot N receives:</text>
  <text x="80" y="412" font-size="10">  { offset = bytes from buffer start to slice NALU start,</text>
  <text x="80" y="427" font-size="10">    size   = bitstream size written by HW,</text>
  <text x="80" y="442" font-size="10">    status = COMPLETE_KHR / NOT_READY / INSUFFICIENT_BITSTREAM_BUFFER_RANGE / ERROR }</text>

  <line x1="310" y1="460" x2="310" y2="490" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="490" width="500" height="90" rx="6" fill="url(#gpuG)" stroke="#2e7d32"/>
  <text x="310" y="513" text-anchor="middle" font-size="12" font-weight="bold">Timeline semaphore signals N</text>
  <text x="310" y="531" text-anchor="middle" font-size="10">vkQueueSubmit2 chains signal_value = ++timeline_val_</text>
  <text x="310" y="546" text-anchor="middle" font-size="10">VulkanFenceHelper fires callback on host once N is reached</text>
  <text x="310" y="562" text-anchor="middle" font-size="10" fill="#1b5e20">No dedicated waiter thread</text>

  <!-- CPU domain -->
  <rect x="600" y="60" width="540" height="540" rx="8" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="870" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#f57f17">Encoder task runner</text>

  <line x1="565" y1="535" x2="615" y2="160" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <rect x="615" y="115" width="510" height="100" rx="6" fill="url(#cpuG)" stroke="#e65100"/>
  <text x="870" y="138" text-anchor="middle" font-size="12" font-weight="bold">callback: TryToReturnBitstreamBuffers()</text>
  <text x="870" y="156" text-anchor="middle" font-size="10">vkGetQueryPoolResults(VK_QUERY_RESULT_WITH_STATUS_BIT_KHR)</text>
  <text x="870" y="170" text-anchor="middle" font-size="10">? feedback {offset, size, status}</text>
  <text x="870" y="186" text-anchor="middle" font-size="10">Reuse query slot for next frame</text>
  <text x="870" y="202" text-anchor="middle" font-size="10" fill="#bf360c">If INSUFFICIENT ? grow VkBuffer � 2 and re-encode</text>

  <line x1="870" y1="215" x2="870" y2="245" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="615" y="245" width="510" height="100" rx="6" fill="url(#cpuG)" stroke="#e65100"/>
  <text x="870" y="268" text-anchor="middle" font-size="12" font-weight="bold">Compose Annex-B output</text>
  <text x="625" y="287" font-size="10">if (is_keyframe) {</text>
  <text x="625" y="301" font-size="10">  memcpy(shmem, packed_sps_, n);  // from H26xAnnexBBitstreamBuilder</text>
  <text x="625" y="315" font-size="10">  memcpy(shmem+n, packed_pps_, m);</text>
  <text x="625" y="329" font-size="10">}</text>
  <text x="625" y="343" font-size="10">memcpy(shmem+offset_so_far, mapped_vk_buf+feedback.offset, feedback.size);</text>

  <line x1="870" y1="345" x2="870" y2="375" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="615" y="375" width="510" height="100" rx="6" fill="url(#cpuG)" stroke="#e65100"/>
  <text x="870" y="398" text-anchor="middle" font-size="12" font-weight="bold">Build BitstreamBufferMetadata</text>
  <text x="625" y="417" font-size="10">  payload_size_bytes = sps_bytes + pps_bytes + slice_bytes</text>
  <text x="625" y="431" font-size="10">  key_frame = picture_is_idr_</text>
  <text x="625" y="445" font-size="10">  timestamp = job.timestamp()</text>
  <text x="625" y="459" font-size="10">  qp = average QP (from query if VK_KHR_video_encode_feedback ext available)</text>

  <line x1="870" y1="475" x2="870" y2="505" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="615" y="505" width="510" height="80" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
  <text x="870" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">
    PostTask ? child_task_runner_
  </text>
  <text x="870" y="550" text-anchor="middle" font-size="11" fill="#1b5e20">
    client_->BitstreamBufferReady(buffer_id, metadata)
  </text>
  <text x="870" y="567" text-anchor="middle" font-size="11" fill="#1b5e20">
    (over Mojo IPC back to the renderer)
  </text>
</svg>
