<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420">
  <defs>
    <linearGradient id="vulkanDecGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vkCompGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dmabufGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="650" height="420" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="325" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Future State: Vulkan Compositor</text>
  <rect x="245" y="35" width="160" height="20" rx="4" fill="#22c55e"/>
  <text x="325" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">--enable-features=Vulkan</text>
  
  <!-- Left column: Vulkan Video Decoder -->
  <rect x="40" y="70" width="200" height="320" rx="10" fill="url(#vulkanDecGrad2)" opacity="0.1"/>
  <rect x="40" y="70" width="200" height="320" rx="10" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">Vulkan Video Decoder</text>
  
  <!-- VkImage box -->
  <rect x="60" y="120" width="160" height="45" rx="6" fill="#fff" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">VkImage</text>
  <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B5CF6">(decoded frame)</text>
  
  <!-- Arrow down -->
  <line x1="140" y1="165" x2="140" y2="185" stroke="#8B5CF6" stroke-width="2"/>
  <polygon points="140,190 135,180 145,180" fill="#8B5CF6"/>
  
  <!-- Export as DMA-BUF -->
  <rect x="60" y="195" width="160" height="40" rx="6" fill="url(#dmabufGrad2)"/>
  <text x="140" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Export as DMA-BUF</text>
  
  <!-- Right column: Vulkan Compositor -->
  <rect x="410" y="70" width="200" height="320" rx="10" fill="url(#vkCompGrad)" opacity="0.1"/>
  <rect x="410" y="70" width="200" height="320" rx="10" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="510" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">Vulkan Compositor</text>
  
  <!-- DMA-BUF arrow across -->
  <line x1="220" y1="215" x2="400" y2="215" stroke="#F97316" stroke-width="3"/>
  <polygon points="405,215 392,208 392,222" fill="#F97316"/>
  <rect x="270" y="200" width="80" height="25" rx="4" fill="#fff" stroke="#F97316" stroke-width="1.5"/>
  <text x="310" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">DMA-BUF</text>
  
  <!-- VkImage import -->
  <rect x="430" y="195" width="160" height="50" rx="6" fill="#fff" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="510" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">VkImage import</text>
  <text x="510" y="232" text-anchor="middle" font-family="monospace" font-size="8" fill="#8B5CF6">VK_EXT_external_memory_dma_buf</text>
  
  <!-- Arrow down -->
  <line x1="510" y1="245" x2="510" y2="265" stroke="#7C3AED" stroke-width="2"/>
  <polygon points="510,270 505,260 515,260" fill="#7C3AED"/>
  
  <!-- Skia draws -->
  <rect x="430" y="275" width="160" height="40" rx="6" fill="#fff" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="510" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">Skia draws with VkImage</text>
  
  <!-- Arrow down -->
  <line x1="510" y1="315" x2="510" y2="335" stroke="#7C3AED" stroke-width="2"/>
  <polygon points="510,340 505,330 515,330" fill="#7C3AED"/>
  
  <!-- Present to screen -->
  <rect x="430" y="345" width="160" height="40" rx="6" fill="url(#vkCompGrad)"/>
  <text x="510" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Present to screen</text>
  
  <!-- Benefits box -->
  <rect x="40" y="280" width="200" height="90" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="140" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a34a">Benefits</text>
  <text x="55" y="320" font-family="Arial, sans-serif" font-size="9" fill="#15803d">• Same API throughout</text>
  <text x="55" y="335" font-family="Arial, sans-serif" font-size="9" fill="#15803d">• Native VkSemaphore sync</text>
  <text x="55" y="350" font-family="Arial, sans-serif" font-size="9" fill="#15803d">• Reduced driver overhead</text>
  <text x="55" y="365" font-family="Arial, sans-serif" font-size="9" fill="#15803d">• Better protected content</text>
  
  <!-- Note -->
  <text x="325" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Vulkan-to-Vulkan path enables optimal synchronization with VkSemaphore</text>
</svg>

